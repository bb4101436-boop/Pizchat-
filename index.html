<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera AI</title>
<meta name="theme-color" content="#000">
<link id="manifestLink" rel="manifest">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.15) brightness(1.03)}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:10}
.topBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #fff3;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
#logo{color:#fff;font-weight:900;padding:6px 14px;border-radius:20px;border:1px solid #2df4a0;background:rgba(0,0,0,.6);font-size:11px}
#bottom{position:fixed;bottom:0;left:0;right:0;padding-bottom:22px;background:linear-gradient(transparent,#000 95%);z-index:20}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px}#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #333;font-size:11px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{display:flex;justify-content:space-evenly;align-items:center}
.cBtn{width:54px;height:54px;border-radius:16px;background:#222;border:2px solid #fff3;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cBtn img{width:100%;height:100%;object-fit:cover}
#shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:4px solid #2df4a0}
#recBtn{width:54px;height:54px;border-radius:50%;background:#ff2a2a;border:3px solid #fff;color:#fff;font-weight:900;font-size:10px}
#aiBtnMain{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2df4a0,#1a73e8);border:3px solid #fff;color:#000;font-weight:900;font-size:12px}
#zoomText{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:20;font-weight:700}
#timerBox{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;display:none}
#timerBox span{background:#ff2a2a;color:#fff;padding:6px 16px;border-radius:20px;font-weight:900;font-size:13px}
.view{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow:auto}
#aiPreview{flex:1;background:#0a0a0a;display:flex;align-items:center;justify-content:center;position:relative}
#aiPreview img{max-width:100%;max-height:100%;object-fit:contain}
#aiLoader{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;z-index:5}
.spinner{width:48px;height:48px;border:4px solid #333;border-top-color:#2df4a0;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#aiTools{padding:12px;background:#111;display:flex;flex-direction:column;gap:10px}
.aiRow{display:flex;gap:8px;overflow-x:auto}.aiRow::-webkit-scrollbar{display:none}
.aiRow button{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;font-size:12px}
#prompt{width:100%;padding:14px;border-radius:14px;background:#1c1c1c;color:#fff;border:1px solid #333}
#genBtn{width:100%;padding:16px;border-radius:14px;background:linear-gradient(90deg,#2df4a0,#1a73e8);border:none;font-weight:900;font-size:16px;color:#000}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="top">
<div style="display:flex;gap:8px;align-items:center"><button class="topBtn" onclick="toggleFlash()">⚡</button><div id="logo">PIZCAMERA AI</div></div>
<div style="display:flex;gap:8px"><button class="topBtn" onclick="flipCamera()">🔄</button><button class="topBtn" onclick="settingsView.style.display='flex'">⚙️</button></div>
</div>

<div id="timerBox"><span id="timeText">● 00:00:00</span></div>
<div id="zoomText">1.0x</div>

<div id="bottom">
<div id="filters">
<button class="active" onclick="setF('contrast(1.08) saturate(1.15) brightness(1.03)',this)">✨ CLEAN</button>
<button onclick="setF('contrast(1.12) saturate(1.25) brightness(1.05)',this)">🔥 VIVID</button>
<button onclick="setF('saturate(1.3) contrast(1.1)',this)">🌈 HOT</button>
<button onclick="setF('none',this)">ORIGINAL</button>
<button onclick="setF('saturate(0) contrast(1.2)',this)">B&W</button>
</div>
<div id="controls">
<button class="cBtn" id="galleryBtn" onclick="galleryView.style.display='flex'">🖼️</button>
<button id="shutter" onclick="takePhoto()"></button>
<button id="aiBtnMain" onclick="aiView.style.display='flex'; if(lastSnap) aiImg.src=lastSnap">AI ✨</button>
<button id="recBtn" onclick="toggleRec()">REC</button>
</div>
</div>

<div id="settingsView" class="view"><div style="padding:14px;display:flex;justify-content:space-between;background:#111"><b style="color:#fff">Settings</b><button onclick="settingsView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Close</button></div><div style="padding:16px;color:#fff">Watermark: <select id="wmSel"><option value="on">ON</option><option value="off">OFF</option></select></div></div>
<div id="galleryView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><span style="color:#fff">Your shots</span><button onclick="galleryView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Close</button></div><div id="grid"></div></div>
<div id="fullView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Back</button><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#222;color:#fff;border:none">X</button></div><img id="fullImg" style="flex:1;object-fit:contain;background:#000;display:none"><video id="fullVideo" style="flex:1;width:100%;background:#000;display:none" controls></video></div>

<!-- AI STUDIO - WORKING 100% -->
<div id="aiView" class="view" style="z-index:200">
<div style="padding:12px;display:flex;justify-content:space-between;background:#111"><button onclick="aiView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;border:none;font-weight:700">← Back</button><span style="color:#2df4a0;font-weight:900">PIZ AI</span><button onclick="downloadAI()" style="padding:8px 14px;border-radius:20px;background:#2df4a0;border:none">Save</button></div>
<div id="aiPreview"><img id="aiImg"><div id="aiLoader"><div class="spinner"></div><div id="loaderText">Generating...</div></div></div>
<div id="aiTools">
<input id="prompt" type="text" placeholder="Type: flying in air like superman, Dubai suit, etc">
<div class="aiRow">
<button onclick="document.getElementById('prompt').value='flying in the air like superman'">🦸 Flying</button>
<button onclick="document.getElementById('prompt').value='swimming underwater'">🏊 Swimming</button>
<button onclick="document.getElementById('prompt').value='Dubai luxury background'">🏙️ Dubai</button>
<button onclick="document.getElementById('prompt').value='wearing black suit'">🤵 Suit</button>
<button onclick="document.getElementById('prompt').value='remove background white'">🧹 Remove BG</button>
</div>
<button id="genBtn" onclick="generateAI()">🚀 GENERATE NOW - TAP HERE</button>
<div style="color:#888;font-size:11px;text-align:center">Button is always here - type what you want then tap Generate</div>
</div>
</div>

<canvas id="canvas"></canvas>
<script>
const ic=document.createElement('canvas');ic.width=512;ic.height=512;const ix=ic.getContext('2d');ix.fillStyle='#0a0a0a';ix.beginPath();ix.roundRect(0,0,512,512,80);ix.fill();ix.fillStyle='#2df4a0';ix.font='bold 420px system-ui';ix.fillText('P',70,480);const iconData=ic.toDataURL('image/png');const mf={name:"PizCamera AI",short_name:"PizCamera",start_url:".",display:"standalone",background_color:"#000",theme_color:"#000",icons:[{src:iconData,sizes:"512x512",type:"image/png"}]};const mb=new Blob([JSON.stringify(mf)],{type:'application/json'});document.getElementById('manifestLink').href=URL.createObjectURL(mb);

const video=document.getElementById('video'),canvas=document.getElementById('canvas'),shutter=document.getElementById('shutter'),recBtn=document.getElementById('recBtn'),settingsView=document.getElementById('settingsView'),galleryView=document.getElementById('galleryView'),fullView=document.getElementById('fullView'),aiView=document.getElementById('aiView'),grid=document.getElementById('grid'),timerBox=document.getElementById('timerBox'),timeText=document.getElementById('timeText'),zoomText=document.getElementById('zoomText'),fullImg=document.getElementById('fullImg'),fullVideo=document.getElementById('fullVideo'),aiImg=document.getElementById('aiImg'),promptEl=document.getElementById('prompt'),loader=document.getElementById('aiLoader');
let stream,facing='environment',zoom=1,sy=0,sz=1,rec,chunks=[],isRecording=false,watermark='on',timer=0,sec=0,timerId=null,items=[],currentFull=null,lastSnap=null;

async function startCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:true});video.srcObject=stream;await video.play()}startCam();
function setF(f,b){video.style.filter=f;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
function flipCamera(){facing=facing==='environment'?'user':'environment';startCam()}
function toggleFlash(){try{let tr=stream.getVideoTracks()[0];tr.applyConstraints({advanced:[{torch:!tr.getSettings().torch}]})}catch{}}
function addToGrid(url,type,name){items.push({url,type,name});let el=document.createElement(type==='img'?'img':'video');el.src=url;el.style.width='100%';el.style.aspectRatio='1';el.style.objectFit='cover';el.onclick=()=>{currentFull={url,type,name};fullView.style.display='flex';if(type==='img'){fullImg.style.display='block';fullVideo.style.display='none';fullImg.src=url}else{fullImg.style.display='none';fullVideo.style.display='block';fullVideo.src=url}};grid.prepend(el);document.getElementById('galleryBtn').innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;if(type==='img')lastSnap=url}
function takePhoto(){canvas.width=video.videoWidth;canvas.height=video.videoHeight;let ctx=canvas.getContext('2d');ctx.filter=video.style.filter;if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0);if(watermark==='on'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,canvas.height-60,canvas.width,60);ctx.fillStyle='#2df4a0';ctx.font=`bold ${canvas.width*.05}px system-ui`;ctx.textAlign='center';ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20)}canvas.toBlob(b=>{let url=URL.createObjectURL(b);let name='PIZ_'+Date.now()+'.jpg';addToGrid(url,'img',name);let a=document.createElement('a');a.href=url;a.download=name;a.click()},'image/jpeg',.92)}
function fmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`}
function toggleRec(){if(!isRecording){chunks=[];sec=0;try{rec=new MediaRecorder(stream,{mimeType:'video/webm'})}catch{rec=new MediaRecorder(stream)}rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);addToGrid(url,'video','PIZ_'+Date.now()+'.webm')};rec.start(500);timerBox.style.display='block';timerId=setInterval(()=>{sec++;timeText.textContent='● '+fmt(sec)},1000);isRecording=true;recBtn.textContent='STOP';recBtn.classList.add('on')}else{clearInterval(timerId);timerBox.style.display='none';rec.stop();isRecording=false;recBtn.textContent='REC';recBtn.classList.remove('on')}}
function downloadAI(){if(!aiImg.src)return;let a=document.createElement('a');a.href=aiImg.src;a.download='PIZ_AI_'+Date.now()+'.jpg';a.click()}
document.getElementById('wmSel').onchange=e=>watermark=e.target.value;
video.addEventListener('touchstart',e=>{if(e.touches.length===1){sy=e.touches[0].clientY;sz=zoom}},{passive:true});
video.addEventListener('touchmove',e=>{zoom=Math.max(1,Math.min(5,sz+(e.touches[0].clientY-sy)/150));video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;zoomText.textContent=zoom.toFixed(1)+'x';zoomText.style.display='block';clearTimeout(window.zt);window.zt=setTimeout(()=>zoomText.style.display='none',800)},{passive:true});

async function generateAI(){
 let p=document.getElementById('prompt').value.trim();
 if(!p){alert('Type what you want first! Example: flying in the air');return}
 let btn=document.getElementById('genBtn');
 btn.textContent='⏳ Generating '+p+'...';
 btn.disabled=true;
 loader.style.display='flex';
 document.getElementById('loaderText').textContent='Generating: '+p;
 try{
  const seed=Math.floor(Math.random()*999999);
  const q=encodeURIComponent(p + ', photorealistic, ultra detailed, 8k, cinematic lighting');
  const url=`https://image.pollinations.ai/prompt/${q}?seed=${seed}&width=1024&height=1024&nologo=true`;
  let img=new Image(); img.crossOrigin='anonymous';
  await new Promise((res,rej)=>{let t=setTimeout(res,15000);img.onload=()=>{clearTimeout(t);res()};img.onerror=()=>{clearTimeout(t);rej()};img.src=url;});
  let c2=document.createElement('canvas');c2.width=1024;c2.height=1024;let ctx2=c2.getContext('2d');ctx2.drawImage(img,0,0,1024,1024);
  ctx2.fillStyle='rgba(0,0,0,.5)';ctx2.fillRect(0,984,1024,40);ctx2.fillStyle='#2df4a0';ctx2.font='bold 14px system-ui';ctx2.fillText('PIZCAMERA AI • '+p.slice(0,35),10,1008);
  let finalUrl=c2.toDataURL('image/jpeg',0.92);
  aiImg.src=finalUrl;
  addToGrid(finalUrl,'img','PIZ_AI_'+Date.now()+'.jpg');
  let a=document.createElement('a');a.href=finalUrl;a.download='PIZ_AI_'+Date.now()+'.jpg';a.click();
  btn.textContent='✅ Done! Saved to Gallery';
 }catch(e){alert('Check internet, try again');btn.textContent='🚀 GENERATE NOW - TAP HERE'}
 loader.style.display='none';btn.disabled=false;setTimeout(()=>btn.textContent='🚀 GENERATE NOW - TAP HERE',3000);
}
</script>
</body>
</html>
