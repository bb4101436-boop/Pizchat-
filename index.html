<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.15) brightness(1.03)}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:10}
.topBtn{width:44px;height:44px;border-radius:50%;background:#0008;border:1px solid #fff3;color:#fff;font-size:18px}
#logo{color:#fff;font-weight:900;padding:6px 16px;border-radius:20px;border:1px solid #2df4a0;background:#0008}
#timerBox{position:fixed;top:70px;left:0;right:0;text-align:center;z-index:50;display:none}
#timerBox span{background:red;color:#fff;padding:6px 18px;border-radius:20px;font-weight:900;letter-spacing:1px;font-size:16px}
#bottom{position:fixed;bottom:0;left:0;right:0;padding:0 0 28px;background:linear-gradient(transparent,#000 80%);z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px} #filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #333;font-size:12px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{max-width:380px;margin:0 auto;display:flex;justify-content:space-between;padding:0 26px;align-items:center}
#gallery{width:52px;height:52px;border-radius:12px;background:#222;border:2px solid #fff5;overflow:hidden;color:#fff}
#shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:4px solid #2df4a0}
#recBtn{width:60px;height:60px;border-radius:50%;background:red;border:3px solid #fff;color:#fff;font-weight:900;font-size:12px}
#recBtn.on{background:#fff;color:red;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="top">
<button class="topBtn" onclick="toggleTorch()">⚡</button>
<div id="logo">PIZCAMERA</div>
<button class="topBtn" onclick="location.reload()">⚙️</button>
</div>
<div id="timerBox"><span id="timeText">● 00:00:00</span></div>
<div id="bottom">
<div id="filters">
<button class="active" onclick="setF('contrast(1.08) saturate(1.15) brightness(1.03)',this)">CLEAN HD</button>
<button onclick="setF('contrast(1.12) saturate(1.25) brightness(1.05)',this)">VIVID</button>
<button onclick="setF('none',this)">ORIGINAL</button>
</div>
<div id="controls">
<button id="gallery">🖼️</button>
<button id="shutter"></button>
<button id="recBtn">REC</button>
</div>
</div>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById('video');
const shutter = document.getElementById('shutter');
const recBtn = document.getElementById('recBtn');
const gallery = document.getElementById('gallery');
const timerBox = document.getElementById('timerBox');
const timeText = document.getElementById('timeText');
const canvas = document.getElementById('canvas');

let stream;
let isRecording = false;
let mediaRecorder;
let chunks = [];
let seconds = 0;
let timerId = null;

// START CAMERA - SIMPLE LOW QUALITY TO AVOID HANG
async function init(){
 try{
  stream = await navigator.mediaDevices.getUserMedia({
   video: { facingMode: "environment", width: 1280, height: 720 },
   audio: true
  });
  video.srcObject = stream;
  await video.play();
 }catch(e){
  alert("Please open on HTTPS (GitHub Pages) and allow camera");
 }
}
init();

function setF(f,b){
 video.style.filter=f;
 document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
}

// PHOTO - FAST
shutter.onclick = () => {
 canvas.width = video.videoWidth;
 canvas.height = video.videoHeight;
 let ctx = canvas.getContext('2d');
 ctx.filter = video.style.filter;
 ctx.drawImage(video,0,0);
 canvas.toBlob(blob=>{
  let url = URL.createObjectURL(blob);
  gallery.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  let a = document.createElement('a');
  a.href = url; a.download = 'piz_'+Date.now()+'.jpg'; a.click();
 },'image/jpeg',0.92);
};

// TIMER FORMATTER - COUNTS HOURS:MINUTES:SECONDS
function format(s){
 let h = Math.floor(s/3600);
 let m = Math.floor((s%3600)/60);
 let sec = s%60;
 return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m)+':'+(sec<10?'0'+sec:sec);
}

// RECORD - FIXED NO HANG VERSION
recBtn.onclick = () => {
 if(!isRecording){
  // START RECORDING
  chunks = [];
  seconds = 0;
  try{
   // Use very low bitrate = no hang
   mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm', videoBitsPerSecond: 1000000 });
  }catch{
   mediaRecorder = new MediaRecorder(stream);
  }
  
  mediaRecorder.ondataavailable = (e) => {
   if(e.data && e.data.size > 0) chunks.push(e.data);
  };
  
  mediaRecorder.onstop = () => {
   let blob = new Blob(chunks, {type: 'video/webm'});
   let url = URL.createObjectURL(blob);
   let a = document.createElement('a');
   a.href = url;
   a.download = 'piz_video_'+Date.now()+'.webm';
   a.click();
   gallery.innerHTML = '🎥';
  };
  
  mediaRecorder.start(500); // collect every 0.5s = smooth, no hang
  
  // START TIMER COUNTING - THIS WILL COUNT LIVE
  timerBox.style.display = 'block';
  timeText.textContent = '● 00:00:00';
  timerId = setInterval(()=>{
   seconds++;
   timeText.textContent = '● ' + format(seconds);
  },1000);
  
  isRecording = true;
  recBtn.classList.add('on');
  recBtn.textContent = 'STOP';
  
 }else{
  // STOP RECORDING
  clearInterval(timerId);
  timerBox.style.display = 'none';
  mediaRecorder.stop();
  isRecording = false;
  recBtn.classList.remove('on');
  recBtn.textContent = 'REC';
 }
};

video.onclick = () => { if(!isRecording) shutter.click(); };

async function toggleTorch(){
 try{
  let track = stream.getVideoTracks()[0];
  let torchOn = track.getSettings().torch;
  await track.applyConstraints({advanced:[{torch:!torchOn}]});
 }catch{}
}
</script>
</body>
</html>
