<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PizChat AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#FFF9FB;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-bottom:1px solid #FFE4EF;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;background:#FF4D8D;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:21px}
.brand h1{font-size:20px;line-height:1.1}
.brand p{font-size:11px;color:#FF4D8D;font-weight:bold}
.right{display:flex;align-items:center;gap:10px}
.new-btn{background:#111;color:#fff;border:none;padding:10px 15px;border-radius:20px;font-size:13px;cursor:pointer}
.menu-btn{width:42px;height:42px;border-radius:50%;border:1px solid #FFE4EF;background:#FFF0F6;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 12px 4px;background:#fff;flex-shrink:0}
.chips button{background:#FFF0F6;border:1px solid #FFE4EF;padding:8px 13px;border-radius:20px;font-size:13px;cursor:pointer}
.chips button:nth-child(even){background:#F7FEE7;border-color:#D9F99D}
#chat{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:#FFF9FB}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
.ai{background:#fff;border:1px solid #FFE4EF;align-self:flex-start}
.user{background:#FF4D8D;color:#fff;align-self:flex-end}
.msg img{width:100%;border-radius:12px;margin-top:10px}
.input-wrap{flex-shrink:0;padding:10px 12px;background:#fff;border-top:1px solid #FFE4EF;position:relative}
.input-box{display:flex;align-items:center;gap:8px;background:#FFF0F6;border:1px solid #FFE4EF;border-radius:28px;padding:6px 6px 6px 10px}
.plus-btn{width:40px;height:40px;border-radius:50%;border:none;background:#fff;font-size:22px;cursor:pointer;flex-shrink:0}
.mic-btn{width:40px;height:40px;border-radius:50%;border:none;background:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#input{flex:1;border:none;background:transparent;outline:none;font-size:15px;padding:10px 0;min-width:0}
#send{background:#A3E635;color:#111;font-weight:bold;font-size:18px;width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0}
.hint{text-align:center;font-size:11px;color:#999;padding:4px 0 6px;background:#fff;flex-shrink:0}
#plusTray{position:absolute;left:12px;right:12px;bottom:72px;background:#fff;border:1px solid #FFE4EF;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.18);padding:8px;display:none;z-index:60;max-height:55vh;overflow-y:auto}
.tray-item{padding:13px 12px;border-radius:12px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:15px}
