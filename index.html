<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizCamera Working</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:12px}
.topBtn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #555;color:#fff}
#logo{background:#000;border:1px solid #2df4a0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900}
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(transparent,#000);padding:10px 10px 20px}
#filters{display:flex;gap:6px;overflow:auto;padding-bottom:10px}
#filters button{padding:6px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #444;white-space:nowrap;font-size:11px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{display:flex;justify-content:space-around;align-items:center}
#controls button{width:54px;height:54px;border-radius:14px;background:#222;border:2px solid #555;color:#fff;font-size:18px}
#shutter{width:70px!important;height:70px!important;border-radius:50%!important;background:#fff!important;border:4px solid #2df4a0!important}
#rec{background:#ff2222!important;color:#fff!important;font-weight:900!important;font-size:10px!important}
#aiBtn{background:linear-gradient(135deg,#2df4a0,#1a73e8)!important;color:#000!important;font-weight:900!important;font-size:10px!important}
#start{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#start button{padding:18px 32px;border-radius:30px;background:#2df4a0;color:#000;font-weight:900;border:none;font-size:18px}
#timer{position:fixed;top:65px;left:50%;transform:translateX(-50%);z-index:10;display:none;background:red;color:#fff;padding:6px 14px;border-radius:20px;font-weight:900}
.view{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1;overflow:auto}
canvas{display:none}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<div id="start">
<div style="font-size:48px">📸</div>
<div style="font-weight:900">PIZCAMERA</div>
<div style="color:#aaa;font-size:12px">Tap to start camera</div>
<button onclick="startCamera()">TAP TO START CAMERA</button>
<div id="err" style="color:#ff5555;font-size:12px;text-align:center;padding:0 20px"></div>
</div>

<div id="top">
<div style="display:flex;gap:8px"><button class="topBtn" onclick="toggleFlash()">⚡</button><div id="logo">PIZCAMERA</div></div>
<div style="display:flex;gap:8px"><button class="topBtn" onclick="switchCam()">🔄</button><button class="topBtn" onclick="openView('settings')">⚙️</button></div>
</div>

<div id="timer">● 00:00:00</div>

<div id="bottom">
<div id="filters">
<button class="active" onclick="setFilter('none',this)">ORIGINAL</button>
<button onclick="setFilter('contrast(1.1) saturate(1.2)',this)">CLEAN</button>
<button onclick="setFilter('contrast(1.2) saturate(1.3)',this)">VIVID</button>
<button onclick="setFilter('saturate(0)',this)">B&W</button>
</div>
<div id="controls">
<button onclick="openView('gallery')">🖼️</button>
<button id="shutter" onclick="takePhoto()">📸</button>
<button id="aiBtn" onclick="openAI()">AI ✨</button>
<button id="rec" onclick="record()">REC</button>
</div>
</div>

<div id="gallery" class="view">
<div style="padding:10px;display:flex;justify-content:space-between;background:#111"><b>Gallery</b><button onclick="closeView('gallery')" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Close</button></div>
<div id="grid"></div>
</div>

<div id="settings" class="view">
<div style="padding:10px;display:flex;justify-content:space-between;background:#111"><b>Settings</b><button onclick="closeView('settings')" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Close</button></div>
<div style="padding:20px;color:#aaa">HD Quality ON • Smooth ON • All buttons working</div>
</div>

<div id="ai" class="view" style="z-index:60">
<div style="padding:10px;display:flex;justify-content:space-between;background:#111"><button onclick="closeView('ai')" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Back</button><b style="color:#2df4a0">AI SMART</b><button onclick="saveAI()" style="padding:8px 14px;border-radius:20px;background:#2df4a0;border:none;font-weight:800">Save</button></div>
<input id="prompt" placeholder="add wings only keep face same" style="margin:10px;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #333;width:calc(100% - 20px)">
<button onclick="genAI()" id="genBtn" style="margin:0 10px 10px;padding:14px;border-radius:12px;background:linear-gradient(90deg,#2df4a0,#1a73e8);border:none;font-weight:900;width:calc(100% - 20px)">GENERATE</button>
<div style="flex:1;background:#111;display:flex;align-items:center;justify-content:center"><img id="aiImg" style="max-width:100%;max-height:100%"></div>
</div>

<canvas id="canvas"></canvas>

<script>
let stream=null, facing='environment', rec=null, chunks=[], isRec=false, sec=0, timer=null, lastPhoto=null;
let video=document.getElementById('video');

async function startCamera(){
 let err=document.getElementById('err');
 err.textContent='Requesting camera...';
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  // SUPER SIMPLE - WORKS ON ALL PHONES
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  video.srcObject=stream;
  await video.play();
  document.getElementById('start').style.display='none';
  video.style.filter='contrast(1.08) saturate(1.15)';
 }catch(e){
  err.textContent='Error: '+e.message+' - Use Chrome + HTTPS';
  alert('BOSS: Open this file via https link. Use Netlify Drop: https://app.netlify.com/drop - drag file there. Camera needs https');
 }
}
function setFilter(f,btn){ video.style.filter=f; document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function switchCam(){ facing=facing==='environment'?'user':'environment'; startCamera(); }
