<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;width:100vw;overflow:hidden;touch-action:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:16px;z-index:20}
.topBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:18px;backdrop-filter:blur(12px)}
#watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.5);color:#fff;padding:6px 18px;border-radius:20px;font-weight:900;letter-spacing:2px;font-size:12px;border:1px solid #2df4a0}
#centerInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 20px;border-radius:30px;display:none;z-index:30;font-weight:bold;backdrop-filter:blur(10px)}
#lockUI{position:fixed;right:16px;bottom:180px;background:#1a73e8;color:#fff;padding:12px 16px;border-radius:24px;display:none;z-index:20;font-size:12px;font-weight:bold;box-shadow:0 8px 30px rgba(26,115,232,0.5)}
#bottom{position:fixed;bottom:0;left:0;width:100%;padding:10px 0 28px;background:linear-gradient(transparent,rgba(0,0,0,0.95));z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:12px}
#filters button.active{background:#fff;color:#000;font-weight:800}
#controls{display:flex;align-items:center;justify-content:center;gap:44px}
#galleryBtn{width:50px;height:50px;border-radius:12px;background:#111;border:2px solid rgba(255,255,255,0.3);overflow:hidden;position:relative}
#galleryBtn img,#galleryBtn video{width:100%;height:100%;object-fit:cover}
#galleryCount{position:absolute;bottom:-4px;right:-4px;background:#2df4a0;color:#000;font-size:10px;font-weight:800;padding:2px 6px;border-radius:10px}
#shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid #2df4a0;box-shadow:0 0 0 8px rgba(255,255,255,0.12),0 0 40px rgba(45,244,160,0.3);transition:all 0.12s;touch-action:none}
#shutter.recording{background:#ff2a2a;border-color:#ff2a2a;transform:scale(1.12);box-shadow:0 0 40px #ff2a2a;animation:pulse 1s infinite}
#shutter.locked{border-color:#1a73e8;box-shadow:0 0 40px #1a73e8}
@keyframes pulse{0%,100%{transform:scale(1.12)}50%{transform:scale(1.2)}}
#flashBtn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:20px;backdrop-filter:blur(10px)}
#installBtn{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#2df4a0;color:#000;padding:10px 22px;border-radius:30px;font-weight:800;font-size:13px;display:none;z-index:30;border:none;box-shadow:0 8px 30px rgba(45,244,160,0.4)}
canvas{display:none}
#galleryView{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#galleryHeader{padding:16px;display:flex;justify-content:space-between;align-items:center;background:#111;position:sticky;top:0}
#galleryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;overflow-y:auto;flex:1}
#galleryGrid img,#galleryGrid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<div id="top">
  <button class="topBtn" id="qualityBtn">4K</button>
  <div id="watermark">PIZCAMERA</div>
  <button class="topBtn" id="flipBtn">↺</button>
</div>

<div id="centerInfo"></div>
<div id="lockUI">⬆️ Drag up to lock<br>🔒 Release to lock</div>
<button id="installBtn">📲 Install PizCamera</button>

<div id="bottom">
  <div id="filters">
    <button class="active" onclick="setF('none',this)">Original</button>
    <button onclick="setF('saturate(1.35) contrast(1.12) brightness(1.03)',this)">HD Ultra</button>
    <button onclick="setF('saturate(1.3) hue-rotate(195deg) contrast(1.1)',this)">Piz Blue</button>
    <button onclick="setF('saturate(1.3) hue-rotate(82deg) contrast(1.1)',this)">Piz Green</button>
    <button onclick="setF('grayscale(100%) contrast(1.1)',this)">B&W</button>
    <button onclick="setF('contrast(1.12) brightness(1.06) saturate(1.05) blur(0.3px)',this)">Beauty Clean</button>
    <button onclick="setF('contrast(1.3) sepia(0.25) brightness(0.95)',this)">Cinema</button>
  </div>
  <div id="controls">
    <button id="galleryBtn">🖼️<span id="galleryCount" style="display:none">0</span></button>
    <button id="shutter"></button>
    <button id="flashBtn">⚡</button>
  </div>
</div>

<canvas id="canvas"></canvas>
<input type="file" id="filePicker" accept="image/*,video/*" multiple style="display:none">

<div id="galleryView">
  <div id="galleryHeader">
    <b style="color:#fff">Gallery • <span style="color:#2df4a0">PIZCAMERA</span> - Tap to view phone files</b>
    <div style="display:flex;gap:8px">
      <button onclick="document.getElementById('filePicker').click()" style="padding:8px 14px;border-radius:20px;border:none;background:#1a73e8;color:#fff;font-weight:bold">📁 Phone Storage</button>
      <button onclick="closeGallery()" style="padding:8px 14px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:bold">✕</button>
    </div>
  </div>
  <div id="galleryGrid"></div>
</div>

<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), shutter=document.getElementById('shutter');
const galleryBtn=document.getElementById('galleryBtn'), galleryView=document.getElementById('galleryView'), galleryGrid=document.getElementById('galleryGrid');
const centerInfo=document.getElementById('centerInfo'), lockUI=document.getElementById('lockUI'), installBtn=document.getElementById('installBtn');
const filePicker=document.getElementById('filePicker'), qualityBtn=document.getElementById('qualityBtn');
let stream, facing='environment', zoom=1, startY=0, startZoom=1, isTorch=false;
let mediaRecorder, chunks=[], recording=false, locked=false, pressTimer, startShutterY=0;
let db, savedCount=0;
let highQuality=true;

// INDEXEDDB FOR GALLERY - LINKS TO DEVICE
let request=indexedDB.open('PizCameraDB',1);
request.onupgradeneeded=e=>{ e.target.result.createObjectStore('media',{keyPath:'id',autoIncrement:true}); };
request.onsuccess=e=>{ db=e.target.result; loadGallery(); };

function saveToDB(blob,type){
 const tx=db.transaction('media','readwrite');
 tx.objectStore('media').add({blob,type,date:Date.now()});
 tx.oncomplete=()=>loadGallery();
}

function loadGallery(){
 if(!db) return;
 const tx=db.transaction('media','readonly');
 const store=tx.objectStore('media');
 const req=store.getAll();
 req.onsuccess=()=>{
  galleryGrid.innerHTML='';
  savedCount=req.result.length;
  document.getElementById('galleryCount').style.display=savedCount?'block':'none';
  document.getElementById('galleryCount').textContent=savedCount;
  req.result.reverse().forEach(item=>{
   const url=URL.createObjectURL(item.blob);
   const el=document.createElement(item.type==='photo'?'img':'video');
   el.src=url; if(item.type==='video') el.controls=true;
   el.onclick=()=>{ window.open(url,'_blank'); };
   galleryGrid.prepend(el);
   if(item===req.result[0]) galleryBtn.innerHTML=`<img src="${url}"><span id="galleryCount" style="display:${savedCount?'block':'none'}">${savedCount}</span>`;
  });
 };
}

// CAMERA START - 4K HIGH QUALITY
async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:facing,
    width:{ideal: highQuality?3840:1920},
    height:{ideal: highQuality?2160:1080},
    frameRate:{ideal:60},
    advanced:[{focusMode:'continuous',exposureMode:'continuous',whiteBalanceMode:'continuous'}]
   },
   audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,sampleRate:48000}
  });
  video.srcObject=stream;
  video.style.transform=facing==='user'?'scaleX(-1)':'none';
 }catch(e){ alert('Allow camera + use HTTPS (GitHub Pages)'); }
}
startCam();
qualityBtn.onclick=()=>{ highQuality=!highQuality; qualityBtn.textContent=highQuality?'4K':'1080'; qualityBtn.style.background=highQuality?'#2df4a0':'rgba(0,0,0,0.55)'; startCam(); };

function setF(f,btn){ video.style.filter=f; document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
document.getElementById('flipBtn').onclick=()=>{ facing=facing==='user'?'environment':'user'; startCam(); };
document.getElementById('flashBtn').onclick=async()=>{
 try{const tr=stream.getVideoTracks()[0]; isTorch=!isTorch; await tr.applyConstraints({advanced:[{torch:isTorch}]}); document.getElementById('flashBtn').style.background=isTorch?'#2df4a0':'rgba(255,255,255,0.15)'}catch{}
};

// ZOOM - DRAG DOWN = IN, UP = OUT
video.addEventListener('touchstart',e=>{if(e.touches.length===1){startY=e.touches[0].clientY;startZoom=zoom}},{passive:true});
video.addEventListener('touchmove',e=>{
 if(e.touches.length===1){
  let diff=e.touches[0].clientY-startY;
  zoom=Math.max(1,Math.min(5,startZoom+diff/150));
  video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;
  centerInfo.textContent=zoom.toFixed(1)+'x';centerInfo.style.display='block';
  clearTimeout(window.zt);window.zt=setTimeout(()=>centerInfo.style.display='none',600);
 }
},{passive:true});

function takePhoto(){
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
 ctx.filter=video.style.filter;
 if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1)}
 ctx.drawImage(video,0,0);ctx.filter='none';
 ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,canvas.height-70,canvas.width,70);
 ctx.fillStyle='#2df4a0';ctx.font=`bold ${canvas.width*0.05}px system-ui`;ctx.textAlign='center';
 ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-22);
 canvas.toBlob(blob=>{
  saveToDB(blob,'photo');
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.download=`PIZ_${Date.now()}.jpg`;a.href=url;a.click();
  centerInfo.textContent='📸 Saved HD';centerInfo.style.display='block';setTimeout(()=>centerInfo.style.display='none',900);
  video.style.filter='brightness(1.5)';setTimeout(()=>video.style.filter=document.querySelector('#filters .active')?video.style.filter:'none',100);
 },'image/jpeg',1.0);
}

// RECORD - SMOOTH CLEAN HIGH QUALITY
function getBestMime(){
 const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
 for(let t of types){ if(MediaRecorder.isTypeSupported(t)) return t; } return 'video/webm';
}
function startRec(){
 chunks=[];
 const mime=getBestMime();
 mediaRecorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond: highQuality? 12000000 : 6000000, audioBitsPerSecond:128000});
 mediaRecorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
 mediaRecorder.onstop=()=>{
  const blob=new Blob(chunks,{type:mime});
  saveToDB(blob,'video');
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`PIZ_${Date.now()}.webm`;a.click();
  centerInfo.textContent='🎥 Video Saved 4K';centerInfo.style.display='block';setTimeout(()=>centerInfo.style.display='none',1200);
 };
 mediaRecorder.start(100); recording=true; shutter.classList.add('recording');
 centerInfo.textContent='● REC 4K';centerInfo.style.display='block'; lockUI.style.display='block';
}
function stopRec(){ if(!recording) return; mediaRecorder.stop(); recording=false; locked=false; shutter.classList.remove('recording','locked'); centerInfo.style.display='none'; lockUI.style.display='none'; }

// SHUTTER LOGIC - TAP PHOTO, HOLD VIDEO, DRAG UP LOCK
shutter.addEventListener('touchstart',e=>{
 e.preventDefault(); startShutterY=e.touches[0].clientY;
 pressTimer=setTimeout(()=>{ startRec(); },350);
},{passive:false});
shutter.addEventListener('touchmove',e=>{
 if(!recording) return; let diff=startShutterY - e.touches[0].clientY;
 if(diff>90 && !locked){ locked=true; shutter.classList.add('locked'); lockUI.innerHTML='🔒 Locked - Hands Free<br>Tap shutter to stop'; centerInfo.textContent='🔒 Locked'; }
},{passive:false});
shutter.addEventListener('touchend',e=>{
 e.preventDefault(); clearTimeout(pressTimer); lockUI.style.display='none';
 if(!recording && !locked){ takePhoto(); } else if(recording && !locked){ stopRec(); }
});
shutter.addEventListener('click',()=>{ if(locked) stopRec(); });

// GALLERY LINKS TO PHONE STORAGE
galleryBtn.onclick=()=>{ galleryView.style.display='flex'; };
function closeGallery(){ galleryView.style.display='none'; }
filePicker.onchange=e=>{
 for(let file of e.target.files){
  const url=URL.createObjectURL(file);
  const type=file.type.startsWith('video')?'video':'photo';
  const el=document.createElement(type==='photo'?'img':'video');
  el.src=url; if(type==='video') el.controls=true;
  galleryGrid.prepend(el);
 }
};

// PWA INSTALL - EASY INSTALL ALL DEVICES
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; installBtn.style.display='block'; });
installBtn.onclick=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; if(r.outcome==='accepted') installBtn.style.display='none'; deferredPrompt=null; } };

// TAP SCREEN = PHOTO
video.addEventListener('click',()=>{ if(!recording) takePhoto(); });
</script>
</body>
</html>
