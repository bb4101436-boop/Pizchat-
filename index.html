<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;width:100vw;overflow:hidden;touch-action:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:18px;z-index:20}
.topBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:18px;backdrop-filter:blur(10px)}
#watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.45);color:#fff;padding:6px 18px;border-radius:20px;font-weight:800;letter-spacing:2px;font-size:12px;border:1px solid rgba(45,244,160,0.5)}
#centerInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:30;font-weight:bold}
#lockUI{position:fixed;right:20px;bottom:160px;background:#1a73e8;color:#fff;padding:10px 14px;border-radius:20px;display:none;z-index:20;font-size:12px;text-align:center}
#bottom{position:fixed;bottom:0;left:0;width:100%;padding:10px 0 26px;background:linear-gradient(transparent,rgba(0,0,0,0.9));z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:12px}
#filters button.active{background:#fff;color:#000;font-weight:bold}
#controls{display:flex;align-items:center;justify-content:center;gap:42px;position:relative}
#galleryBtn{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);overflow:hidden}
#galleryBtn img{width:100%;height:100%;object-fit:cover}
#shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #2df4a0;box-shadow:0 0 0 6px rgba(255,255,255,0.15);transition:all 0.1s;touch-action:none}
#shutter.recording{background:#ff2a2a;border-color:#ff2a2a;transform:scale(1.15);box-shadow:0 0 30px #ff2a2a}
#shutter.locked{border-color:#1a73e8;box-shadow:0 0 30px #1a73e8}
#flashBtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:18px}
canvas{display:none}
#galleryView{position:fixed;inset:0;background:#000;z-index:100;display:none;overflow-y:auto;padding:10px}
#galleryView img, #galleryView video{width:100%;margin-bottom:10px;border-radius:10px}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<div id="top">
  <div></div>
  <div id="watermark">PIZCAMERA</div>
  <button class="topBtn" id="flipBtn">↺</button>
</div>

<div id="centerInfo"></div>
<div id="lockUI">🔒 Drag up to lock<br>⬆️ Release to lock</div>

<div id="bottom">
  <div id="filters">
    <button class="active" onclick="setF('none',this)">Normal</button>
    <button onclick="setF('saturate(1.4) contrast(1.15)',this)">HD Clear</button>
    <button onclick="setF('saturate(1.2) hue-rotate(190deg)',this)">Piz Blue</button>
    <button onclick="setF('saturate(1.2) hue-rotate(85deg)',this)">Piz Green</button>
    <button onclick="setF('grayscale(100%)',this)">B&W</button>
    <button onclick="setF('contrast(1.1) brightness(1.05) blur(0.4px)',this)">Beauty</button>
  </div>
  <div id="controls">
    <button id="galleryBtn">🖼️</button>
    <button id="shutter"></button>
    <button id="flashBtn">⚡</button>
  </div>
</div>

<canvas id="canvas"></canvas>
<div id="galleryView"><button onclick="this.parentElement.style.display='none'" style="position:sticky;top:10px;z-index:2;padding:8px 16px;border-radius:20px;border:none;background:#fff;color:#000;font-weight:bold">Close ✕</button><div id="galleryContent"></div></div>

<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), shutter=document.getElementById('shutter');
const galleryBtn=document.getElementById('galleryBtn'), galleryView=document.getElementById('galleryView'), galleryContent=document.getElementById('galleryContent');
const centerInfo=document.getElementById('centerInfo'), lockUI=document.getElementById('lockUI');
let stream, facing='environment', zoom=1, startY=0, startZoom=1, isTorch=false;
let mediaRecorder, chunks=[], recording=false, locked=false, pressTimer, startShutterY=0;
let savedMedia=[];

async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
 video.srcObject=stream;
}
startCam();

function setF(f,btn){
 video.style.filter=f;
 document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
}
document.getElementById('flipBtn').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
document.getElementById('flashBtn').onclick=async()=>{
 try{const tr=stream.getVideoTracks()[0];isTorch=!isTorch;await tr.applyConstraints({advanced:[{torch:isTorch}]})}catch{alert('Flash not supported')}
};

// ZOOM - ONE FINGER DRAG ON SCREEN
video.addEventListener('touchstart',e=>{if(e.touches.length===1){startY=e.touches[0].clientY;startZoom=zoom}},{passive:true});
video.addEventListener('touchmove',e=>{
 if(e.touches.length===1){
  let diff=e.touches[0].clientY-startY;
  zoom=Math.max(1,Math.min(4,startZoom+diff/180));
  video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;
  centerInfo.textContent=zoom.toFixed(1)+'x';centerInfo.style.display='block';
  clearTimeout(window.zt);window.zt=setTimeout(()=>centerInfo.style.display='none',600);
 }
},{passive:true});

// PHOTO
function takePhoto(){
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 const ctx=canvas.getContext('2d');ctx.filter=video.style.filter;
 if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1)}
 ctx.drawImage(video,0,0);ctx.filter='none';
 ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,canvas.height-55,canvas.width,55);
 ctx.fillStyle='#2df4a0';ctx.font=`bold ${canvas.width*0.045}px system-ui`;ctx.textAlign='center';
 ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-18);
 const url=canvas.toDataURL('image/jpeg',1.0);
 savedMedia.unshift({type:'photo',url});
 addToGallery(url,'photo');
 galleryBtn.innerHTML=`<img src="${url}">`;
 // download
 const a=document.createElement('a');a.download='PizCamera_'+Date.now()+'.jpg';a.href=url;a.click();
}

// GALLERY - LEFT DOWN BUTTON
galleryBtn.onclick=()=>{ galleryView.style.display='block'; };
function addToGallery(url,type){
 const el=document.createElement(type==='photo'?'img':'video');
 el.src=url; if(type==='video') el.controls=true;
 galleryContent.prepend(el);
}

// VIDEO - TAP TO RECORD, DRAG UP TO LOCK
function startRec(){
 chunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 mediaRecorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
 mediaRecorder.onstop=()=>{
  const blob=new Blob(chunks,{type:'video/webm'});
  const url=URL.createObjectURL(blob);
  savedMedia.unshift({type:'video',url});
  addToGallery(url,'video');
  galleryBtn.innerHTML=`<video src="${url}" style="width:100%;height:100%"></video>`;
  const a=document.createElement('a');a.href=url;a.download='PizCamera_'+Date.now()+'.webm';a.click();
 };
 mediaRecorder.start(); recording=true; shutter.classList.add('recording');
 centerInfo.textContent='● Recording';centerInfo.style.display='block';
}
function stopRec(){
 if(!recording) return;
 mediaRecorder.stop(); recording=false; locked=false;
 shutter.classList.remove('recording','locked');
 centerInfo.style.display='none'; lockUI.style.display='none';
}

// SHUTTER TOUCH LOGIC
shutter.addEventListener('touchstart',e=>{
 e.preventDefault(); startShutterY=e.touches[0].clientY;
 pressTimer=setTimeout(()=>{ // Long press = video
  startRec(); lockUI.style.display='block';
 },300);
});

shutter.addEventListener('touchmove',e=>{
 if(!recording) return;
 let diff=startShutterY - e.touches[0].clientY; // drag up
 if(diff>80 && !locked){
  locked=true; shutter.classList.add('locked'); shutter.classList.remove('recording');
  lockUI.innerHTML='🔒 Locked - Tap to stop'; centerInfo.textContent='🔒 Locked - Hands free';
 }
});

shutter.addEventListener('touchend',e=>{
 e.preventDefault(); clearTimeout(pressTimer); lockUI.style.display='none';
 if(!recording && !locked){
  // Short tap = photo
  takePhoto();
 }else if(recording && !locked){
  // Release without lock = stop video
  stopRec();
 }
});

shutter.addEventListener('click',()=>{
 if(locked){ stopRec(); } // Tap when locked = stop
});

// Tap screen still takes photo
video.addEventListener('click',()=>{ if(!recording) takePhoto(); });

</script>
</body>
</html>
