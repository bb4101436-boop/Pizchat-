<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;background:#000">
<video id="v" autoplay playsinline muted style="width:100vw;height:100vh;object-fit:cover;background:#111"></video>
<button onclick="go()" id="b" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px 40px;border-radius:30px;background:#2df4a0;color:#000;font-weight:900;border:none;font-size:20px;z-index:10">OPEN PIZCAMERA</button>
<script>
function go(){
navigator.mediaDevices.getUserMedia({video:true}).then(s=>{
document.getElementById('v').srcObject=s;
document.getElementById('v').play();
document.getElementById('b').style.display='none';
}).catch(e=>{alert(e.message)})
}
</script>
</body>
</html>
