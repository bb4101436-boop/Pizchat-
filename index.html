<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizCamera AI - FINAL WORKING</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}
#video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#111;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px;z-index:9999;pointer-events:auto}
#top button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.8);color:#fff;border:1px solid #fff4;font-size:18px;pointer-events:auto}
#centerBox{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:9998;text-align:center;background:rgba(0,0,0,0.9);padding:20px;border-radius:20px;border:1px solid #2df4a0}
#centerBox button{padding:16px 30px;border-radius:30px;background:#2df4a0;color:#000;font-weight:900;border:none;font-size:18px;margin-top:10px}
#bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000 80%);padding:10px;z-index:9999;pointer-events:auto}
#filters{display:flex;gap:6px;overflow:auto;padding-bottom:10px}
#filters button{padding:6px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;white-space:nowrap;pointer-events:auto}
#controls{display:flex;justify-content:space-around;align-items:center;pointer-events:auto}
#controls button{width:60px;height:60px;border-radius:16px;background:#222;color:#fff;border:2px solid #fff3;font-size:22px;pointer-events:auto}
#shutter{width:74px!important;height:74px!important;border-radius:50%!important;background:#fff!important;border:4px solid #2df4a0!important}
#aiScreen{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column}
#aiScreen input{width:90%;margin:10px auto;display:block;padding:14px;border-radius:12px;background:#222;color:#fff;border:1px solid #333}
#aiScreen #genBtn{width:90%;margin:10px auto;display:block;padding:14px;border-radius:12px;background:linear-gradient(90deg,#2df4a0,#1a73e8);color:#000;font-weight:900;border:none}
#aiPreview{flex:1;background:#111;display:flex;align-items:center;justify-content:center}
#aiPreview img{max-width:100%;max-height:100%}
#gallery{position:fixed;inset:0;background:#000;z-index:9999;display:none;padding:10px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
#msg{color:#2df4a0;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<div id="top">
<button onclick="toggleFlash()">⚡</button>
<div style="background:rgba(0,0,0,0.8);border:1px solid #2df4a0;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px">PIZCAMERA AI</div>
<div style="display:flex;gap:8px"><button onclick="flipCamera()">🔄</button><button onclick="alert('Settings: OK')">⚙️</button></div>
</div>

<div id="centerBox">
<div id="msg">Ready boss!</div>
<button onclick="startCamera()">📷 START CAMERA TAP HERE</button>
<div style="font-size:11px;color:#aaa;margin-top:8px">Allow camera permission</div>
</div>

<div id="bottom">
<div id="filters">
<button onclick="setFilter('none')">ORIGINAL</button>
<button onclick="setFilter('contrast(1.2) saturate(1.3)')">VIVID</button>
<button onclick="setFilter('saturate(0)')">B&W</button>
<button onclick="setFilter('contrast(1.1) saturate(1.2) brightness(1.05)')">CLEAN</button>
</div>
<div id="controls">
<button onclick="openGallery()">🖼️</button>
<button id="shutter" onclick="takePhoto()">📸</button>
<button onclick="openAI()" style="background:linear-gradient(135deg,#2df4a0,#1a73e8);color:#000;font-weight:900">AI</button>
<button onclick="toggleRec()" id="recBtn">REC</button>
</div>
</div>

<div id="aiScreen">
<div style="padding:10px;display:flex;justify-content:space-between;background:#111">
<button onclick="closeAI()" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">← Back</button>
<span style="color:#2df4a0;font-weight:900">PIZ AI SMART</span>
<button onclick="saveAI()" style="padding:8px 14px;border-radius:20px;background:#2df4a0;border:none;font-weight:800">Save</button>
</div>
<input id="prompt" placeholder="Type: add wings only keep face same">
<button id="genBtn" onclick="generateSmart()">🚀 GENERATE - DOES EXACTLY WHAT YOU TYPE</button>
<div id="aiPreview"><img id="aiImg"></div>
<div style="padding:10px;display:flex;gap:6px;overflow:auto">
<button onclick="setPrompt('add angel wings only, keep my face and clothes same')" style="padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;white-space:nowrap">Wings Only</button>
<button onclick="setPrompt('make me fly like superman, keep my face same')" style="padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;white-space:nowrap">Fly</button>
<button onclick="setPrompt('change background to Dubai only, keep my face same')" style="padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;white-space:nowrap">Dubai Only</button>
<button onclick="setPrompt('wearing black suit only, keep my face same')" style="padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #333;white-space:nowrap">Suit Only</button>
</div>
</div>

<div id="gallery">
<button onclick="closeGallery()" style="padding:8px 14px;border-radius:20px;background:#fff;border:none">Close ✕</button>
<div id="grid"></div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
let stream=null, facing='environment', lastPhoto=null, rec=null, chunks=[], isRec=false, timer=null, sec=0;
const video=document.getElementById('video');

function setFilter(f){ video.style.filter=f; }

async function startCamera(){
 const msg=document.getElementById('msg');
 msg.textContent='Starting...';
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  video.srcObject=stream;
  await video.play();
  document.getElementById('centerBox').style.display='none';
 }catch(e){
  msg.textContent='Allow camera: '+e.message;
  alert('Boss use Chrome and HTTPS link. Upload to netlify drop: https://app.netlify.com/drop');
 }
}
function flipCamera(){ facing=facing==='environment'?'user':'environment'; startCamera(); }
function toggleFlash(){ alert('Flash: tap phone flashlight'); }
function takePhoto(){
 const canvas=document.getElementById('canvas');
 canvas.width=video.videoWidth||1280;
 canvas.height=video.videoHeight||720;
 const ctx=canvas.getContext('2d');
 if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
 ctx.drawImage(video,0,0);
 ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,canvas.height-40,canvas.width,40);
 ctx.fillStyle='#2df4a0';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-15);
 const url=canvas.toDataURL('image/jpeg',0.92);
 lastPhoto=url;
 document.getElementById('aiImg').src=url;
 addToGrid(url);
 const a=document.createElement('a');a.href=url;a.download='PIZ_'+Date.now()+'.jpg';a.click();
 alert('Photo saved! Now tap AI button - it works!');
}
function openAI(){
 if(!lastPhoto){alert('Snap photo first! Tap white shutter');return;}
 document.getElementById('aiScreen').style.display='flex';
 document.getElementById('aiImg').src=lastPhoto;
}
function closeAI(){ document.getElementById('aiScreen').style.display='none'; }
function openGallery(){ document.getElementById('gallery').style.display='block'; }
function closeGallery(){ document.getElementById('gallery').style.display='none'; }
function addToGrid(url){
 const img=document.createElement('img');img.src=url;img.style.width='100%';img.style.aspectRatio='1';img.style.objectFit='cover';img.style.background='#222';
 document.getElementById('grid').prepend(img);
}
function saveAI(){
 const src=document.getElementById('aiImg').src;
 if(!src){alert('Generate first');return;}
 const a=document.createElement('a');a.href=src;a.download='PIZ_AI_'+Date.now()+'.jpg';a.click();
}
function setPrompt(t){ document.getElementById('prompt').value=t; }
function toggleRec(){
 const btn=document.getElementById('recBtn');
 const msg=document.getElementById('msg');
 const box=document.getElementById('centerBox');
 if(!isRec){
  chunks=[];sec=0;
  try{rec=new MediaRecorder(stream);}catch(e){alert('REC not supported on this browser');return;}
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=()=>{
   const blob=new Blob(chunks,{type:'video/webm'});
   const url=URL.createObjectURL(blob);
   addToGrid(url);
   const a=document.createElement('a');a.href=url;a.download='PIZ_'+Date.now()+'.webm';a.click();
  };
  rec.start();
  isRec=true;btn.textContent='STOP';btn.style.background='#fff';btn.style.color='red';
  box.style.display='block';msg.textContent='● REC 00:00:00';
  timer=setInterval(()=>{sec++;let h=Math.floor(sec/3600),m=Math.floor((sec%360
