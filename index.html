<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.15) brightness(1.03);transform-origin:center}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;z-index:10}
.topBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid #fff3;color:#fff;font-size:16px;backdrop-filter:blur(8px)}
#logo{color:#fff;font-weight:900;padding:7px 18px;border-radius:20px;border:1px solid #2df4a0;background:rgba(0,0,0,0.5);letter-spacing:2px;font-size:13px}
#timerBox{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;display:none}
#timerBox span{background:#ff2a2a;color:#fff;padding:6px 18px;border-radius:20px;font-weight:900;font-size:14px;letter-spacing:1px}
#bottom{position:fixed;bottom:0;left:0;right:0;padding-bottom:26px;background:linear-gradient(transparent,#000 85%);z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px} #filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #333;font-size:12px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{max-width:380px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 24px}
#gallery{width:52px;height:52px;border-radius:12px;background:#222;border:2px solid #fff5;overflow:hidden;color:#fff;font-size:20px}
#gallery img{width:100%;height:100%;object-fit:cover}
#shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:4px solid #2df4a0;box-shadow:0 0 0 6px #fff2}
#recBtn{width:60px;height:60px;border-radius:50%;background:#ff2a2a;border:3px solid #fff;color:#fff;font-weight:900;font-size:11px}
#recBtn.on{background:#fff;color:red;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#zoomText{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:20;font-weight:700}
#settingsView{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;overflow:auto}
.settingRow{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #1a1a1a;color:#fff}
.settingRow select,.settingRow button{padding:8px 14px;border-radius:10px;border:none;background:#222;color:#fff;font-weight:600}
#galleryView{position:fixed;inset:0;background:#000;z-index:90;display:none;flex-direction:column}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;overflow:auto}
#grid img,#grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="top">
<button class="topBtn" id="flashBtn">⚡</button>
<div id="logo">PIZCAMERA</div>
<button class="topBtn" id="settingsBtn">⚙️</button>
</div>

<div id="timerBox"><span id="timeText">● 00:00:00</span></div>
<div id="zoomText">1.0x</div>

<div id="bottom">
<div id="filters">
<button class="active" onclick="setF('contrast(1.08) saturate(1.15) brightness(1.03)',this)">✨ CLEAN</button>
<button onclick="setF('contrast(1.12) saturate(1.25) brightness(1.05)',this)">🔥 VIVID</button>
<button onclick="setF('contrast(1.06) brightness(1.08) saturate(1.1)',this)">💎 CRYSTAL</button>
<button onclick="setF('saturate(1.3) contrast(1.1)',this)">🌈 HOT</button>
<button onclick="setF('saturate(1.2) hue-rotate(200deg) contrast(1.1)',this)">💙 BLUE</button>
<button onclick="setF('saturate(1.2) hue-rotate(80deg) contrast(1.1)',this)">💚 GREEN</button>
<button onclick="setF('none',this)">Original</button>
<button onclick="setF('saturate(0) contrast(1.2)',this)">B&W</button>
</div>
<div id="controls">
<button id="gallery">🖼️</button>
<button id="shutter"></button>
<button id="recBtn">REC</button>
</div>
</div>

<div id="settingsView">
<div style="padding:16px;display:flex;justify-content:space-between;background:#111;position:sticky;top:0">
<b style="color:#fff;font-size:18px">⚙️ PizCamera Settings</b>
<button onclick="settingsView.style.display='none'" style="padding:8px 16px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button>
</div>
<div class="settingRow"><span>📷 Camera</span><select id="facingSel"><option value="environment">Back Camera</option><option value="user">Front Camera</option></select></div>
<div class="settingRow"><span>🎥 Quality</span><select id="qualitySel"><option value="fhd">Full HD Smooth (No Hang)</option><option value="hd">HD Fast</option><option value="4k">4K High</option></select></div>
<div class="settingRow"><span>©️ Watermark</span><select id="wmSel"><option value="on">ON</option><option value="off">OFF</option></select></div>
<div class="settingRow"><span>⏱️ Timer</span><select id="timerSel"><option value="0">Off</option><option value="3">3s</option><option value="5">5s</option></select></div>
<div class="settingRow"><span>📁 Open Phone Storage</span><button onclick="filePick.click()">Open</button></div>
<div class="settingRow"><span>🔄 Reset Filter</span><button onclick="setF('contrast(1.08) saturate(1.15) brightness(1.03)',document.querySelector('#filters button'))">Clean</button></div>
<div style="padding:20px;color:#666;font-size:12px;text-align:center">PizCamera v4.0<br>Smooth Record + Zoom + Clean Filters</div>
</div>

<div id="galleryView">
<div style="padding:12px;display:flex;justify-content:space-between;background:#111;position:sticky;top:0">
<button onclick="filePick.click()" style="padding:8px 14px;border-radius:20px;background:#1a73e8;color:#fff;border:none;font-weight:bold">📁 Phone Storage</button>
<button onclick="galleryView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button>
</div>
<div id="grid"></div>
</div>

<canvas id="canvas"></canvas>
<input type="file" id="filePick" accept="image/*,video/*" multiple hidden>

<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), shutter=document.getElementById('shutter'), recBtn=document.getElementById('recBtn'), gallery=document.getElementById('gallery'), settingsView=document.getElementById('settingsView'), galleryView=document.getElementById('galleryView'), grid=document.getElementById('grid'), timerBox=document.getElementById('timerBox'), timeText=document.getElementById('timeText'), zoomText=document.getElementById('zoomText'), filePick=document.getElementById('filePick');
let stream, facing='environment', zoom=1, sy=0, sz=1, torch=false, rec, chunks=[], isRecording=false, quality='fhd', watermark='on', timer=0, sec=0, timerId=null;

// START CAMERA
async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 let w=1280,h=720; if(quality==='fhd') {w=1920;h=1080} if(quality==='4k'){w=1920;h=1080}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:w},height:{ideal:h}},audio:true});
  video.srcObject=stream; await video.play();
 }catch(e){ alert('Use GitHub Pages HTTPS'); }
}
startCam();

function setF(f,b){ video.style.filter=f; document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active')); if(b) b.classList.add('active'); }

// SETTINGS OPEN AGAIN
document.getElementById('settingsBtn').onclick=()=>{ settingsView.style.display='flex'; };
document.getElementById('facingSel').onchange=e=>{ facing=e.target.value; startCam(); };
document.getElementById('qualitySel').onchange=e=>{ quality=e.target.value; startCam(); };
document.getElementById('wmSel').onchange=e=>watermark=e.target.value;
document.getElementById('timerSel').onchange=e=>timer=parseInt(e.target.value);
document.getElementById('flashBtn').onclick=async()=>{
 try{ let tr=stream.getVideoTracks()[0]; torch=!torch; await tr.applyConstraints({advanced:[{torch}]}); }catch{}
};

// GALLERY AGAIN - SEE WHAT YOU SNAP INSIDE STORAGE
function addToGrid(url,type){
 let el=document.createElement(type==='img'?'img':'video'); el.src=url; if(type!=='img') el.controls=true;
 grid.prepend(el);
 gallery.innerHTML=`<img src="${url}">`;
}
gallery.onclick=()=>{ galleryView.style.display='flex'; };
filePick.onchange=e=>{ for(let f of e.target.files){ let url=URL.createObjectURL(f); addToGrid(url,f.type.startsWith('video')?'video':'img'); } galleryView.style.display='flex'; };

// ZOOM WHILE RECORDING - NOW WORKING
function applyZoom(){
 video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;
 zoomText.textContent=zoom.toFixed(1)+'x'; zoomText.style.display='block'; clearTimeout(window.zt); window.zt=setTimeout(()=>zoomText.style.display='none',800);
 document.getElementById('settingsView').querySelectorAll('.settingRow')[2]?.querySelector('span')?.textContent;
}
video.addEventListener('touchstart',e=>{
 if(e.touches.length===1){ sy=e.touches[0].clientY; sz=zoom; }
 if(e.touches.length===2){ // pinch zoom
  let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  sy=d; sz=zoom;
 }
},{passive:true});
video.addEventListener('touchmove',e=>{
 if(e.touches.length===1){
  let d=e.touches[0].clientY-sy;
  zoom=Math.max(1,Math.min(5,sz+d/150));
  applyZoom();
 }
 if(e.touches.length===2){
  let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  zoom=Math.max(1,Math.min(5,sz*(d/sy)));
  applyZoom();
 }
},{passive:true});

// PHOTO
function takePhoto(){
 const doSnap=()=>{
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  let ctx=canvas.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.filter=video.style.filter;
  if(facing==='user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
  ctx.drawImage(video,0,0);
  if(watermark==='on'){ ctx.filter='none'; ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,canvas.height-60,canvas.width,60); ctx.fillStyle='#2df4a0'; ctx.font=`bold ${canvas.width*0.05}px system-ui`; ctx.textAlign='center'; ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20); }
  canvas.toBlob(b=>{ let url=URL.createObjectURL(b); addToGrid(url,'img'); let a=document.createElement('a'); a.href=url; a.download='PIZ_'+Date.now()+'.jpg'; a.click(); },'image/jpeg',0.92);
 };
 if(timer>0){ let c=timer; let iv=setInterval(()=>{ zoomText.textContent=c+'s'; zoomText.style.display='block'; c--; if(c<0){ clearInterval(iv); zoomText.style.display='none'; doSnap(); } },1000); } else doSnap();
}
shutter.onclick=takePhoto;

// VIDEO - SMOOTH + COUNTING + ZOOMABLE
function fmt(s){ let h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`; }
recBtn.onclick=()=>{
 if(!isRecording){
  chunks=[]; sec=0;
  try{ rec=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:1500000}); }catch{ rec=new MediaRecorder(stream); }
  rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
  rec.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); addToGrid(url,'video'); let a=document.createElement('a'); a.href=url; a.download='PIZ_'+Date.now()+'.webm'; a.click(); };
  rec.start(500);
  timerBox.style.display='block'; timeText.textContent='● 00:00:00';
  timerId=setInterval(()=>{ sec++; timeText.textContent='● '+fmt(sec); },1000);
  isRecording=true; recBtn.classList.add('on'); recBtn.textContent='STOP';
 }else{
  clearInterval(timerId); timerBox.style.display='none'; rec.stop(); isRecording=false; recBtn.classList.remove('on'); recBtn.textContent='REC';
 }
};
</script>
</body>
</html>
