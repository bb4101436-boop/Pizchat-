<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PIZCAMERA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw}
#video{width:100%;height:100%;object-fit:cover;display:block}
#zoomInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.6);color:#fff;padding:8px 16px;border-radius:20px;font-size:18px;font-weight:bold;display:none;z-index:99}
#controls{position:fixed;bottom:0;left:0;width:100%;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,0.8));display:flex;justify-content:space-around;align-items:center;z-index:10}
#shutter{width:70px;height:70px;background:#fff;border-radius:50%;border:4px solid #2df4a0}
#flip{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:20px}
#filterBar{position:fixed;bottom:100px;left:0;width:100%;display:flex;gap:10px;overflow-x:auto;padding:10px;z-index:10}
#filterBar button{padding:8px 14px;border-radius:20px;border:1px solid #555;background:#222;color:#fff;white-space:nowrap}
#filterBar button.active{background:#1a73e8}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<div id="zoomInfo">1.0x</div>

<div id="filterBar">
<button class="active" onclick="setFilter('none',this)">Normal</button>
<button onclick="setFilter('grayscale(100%)',this)">B&W</button>
<button onclick="setFilter('sepia(100%)',this)">Sepia</button>
<button onclick="setFilter('saturate(150%) contrast(120%)',this)">Vivid HD</button>
<button onclick="setFilter('saturate(130%) hue-rotate(180deg)',this)">PIZ Blue</button>
</div>

<div id="controls">
<button id="flip">↺</button>
<button id="shutter"></button>
<button id="flip" onclick="alert('Swipe UP/DOWN with one finger to zoom')">?</button>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const zoomInfo = document.getElementById('zoomInfo');
let currentStream;
let facing = 'environment';
let zoom = 1;
let startY = 0;
let startZoom = 1;

// START CAMERA - SIMPLE WORKING
async function startCamera() {
  if(currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing },
      audio: false
    });
    video.srcObject = currentStream;
    video.style.transform = facing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
    video.style.filter = 'none';
    zoom = 1;
    applyZoom();
  } catch(err) {
    alert('Camera error: ' + err.message + '. Please allow camera permission and use HTTPS.');
  }
}
startCamera();

// FLIP CAMERA
document.getElementById('flip').onclick = () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  startCamera();
};

// FILTER
function setFilter(f, btn) {
  video.style.filter = f;
  document.querySelectorAll('#filterBar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ZOOM FUNCTION - CLEAR AND CLEAN
function applyZoom() {
  if(facing === 'user') {
    video.style.transform = `scaleX(-1) scale(${zoom})`;
  } else {
    video.style.transform = `scale(${zoom})`;
  }
  zoomInfo.textContent = zoom.toFixed(1) + 'x';
  zoomInfo.style.display = 'block';
  clearTimeout(window.zoomTimer);
  window.zoomTimer = setTimeout(()=>{ zoomInfo.style.display='none'; }, 800);
}

// ONE FINGER DRAG DOWN = ZOOM IN, UP = ZOOM OUT
video.addEventListener('touchstart', (e)=>{
  if(e.touches.length === 1) {
    startY = e.touches[0].clientY;
    startZoom = zoom;
  }
}, {passive:true});

video.addEventListener('touchmove', (e)=>{
  if(e.touches.length === 1) {
    e.preventDefault();
    let currentY = e.touches[0].clientY;
    let diff = currentY - startY; // DOWN is positive
    // Drag down = zoom in, drag up = zoom out
    let newZoom = startZoom + (diff / 200); 
    if(newZoom < 1) newZoom = 1;
    if(newZoom > 4) newZoom = 4;
    zoom = newZoom;
    applyZoom();
  }
}, {passive:false});

// MOUSE FOR PC TESTING
let mouseDown = false;
video.addEventListener('mousedown', e=>{ mouseDown=true; startY=e.clientY; startZoom=zoom; });
video.addEventListener('mousemove', e=>{
  if(!mouseDown) return;
  let diff = e.clientY - startY;
  let newZoom = startZoom + (diff / 200);
  if(newZoom < 1) newZoom = 1;
  if(newZoom > 4) newZoom = 4;
  zoom = newZoom;
  applyZoom();
});
video.addEventListener('mouseup', ()=>{ mouseDown=false; });

// TAKE PHOTO - WORKING
document.getElementById('shutter').onclick = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.filter = video.style.filter;
  if(facing === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  // Keep quality high even when zoomed
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const link = document.createElement('a');
  link.download = 'PIZCAMERA_'+Date.now()+'.jpg';
  link.href = canvas.toDataURL('image/jpeg', 1.0);
  link.click();
  zoomInfo.textContent = 'Saved! 📸';
  zoomInfo.style.display = 'block';
  setTimeout(()=>zoomInfo.style.display='none',1000);
};
</script>
</body>
</html>
