<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIZCAMERA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100dvh;overflow:hidden;font-family:sans-serif;touch-action:none}
#v{width:100vw;height:100dvh;object-fit:cover;will-change:transform;transform:translateZ(0);image-rendering:-webkit-optimize-contrast}
#zoomBar{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:4px;height:160px;background:#ffffff22;border-radius:99px;overflow:hidden;z-index:20}
#zoomFill{width:100%;height:0%;background:linear-gradient(#1a73e8,#2df4a0);transition:height .05s linear}
#zoomText{position:fixed;right:28px;top:50%;transform:translateY(-50%);background:#000a;color:#fff;padding:6px 10px;border-radius:99px;font-size:12px;display:none;z-index:20;backdrop-filter:blur(10px)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.row{display:flex;justify-content:space-between;padding:16px;pointer-events:auto}
.btn{width:44px;height:44px;border-radius:50%;border:none;background:#0007;color:#fff;font-size:18px;backdrop-filter:blur(12px)}
#shutter{width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid #2df4a0;box-shadow:0 0 0 6px #fff2;transition:transform .08s}
#shutter:active{transform:scale(.88)}
.filters{display:flex;gap:10px;overflow-x:auto;padding:0 12px 14px;pointer-events:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:9px 16px;border-radius:99px;border:1px solid #ffffff22;background:#111a;color:#fff;font-size:13px;backdrop-filter:blur(10px)}
.filters .on{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 18px #ffffff88}
.bottom{padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent,#000c);pointer-events:auto}
.center{display:flex;justify-content:space-around;align-items:center;padding:10px 12px 16px}
.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0008;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:30;backdrop-filter:blur(12px);animation:fade 3s forwards}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
canvas{display:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="zoomBar"><div id="zoomFill"></div></div>
<div id="zoomText">1.0x</div>
<div class="hint" id="hint">↕️ One finger drag up/down to zoom</div>

<div class="ui">
<div class="row"><button class="btn" id="torch">⚡</button><button class="btn" id="flip">↺</button></div>
<div class="bottom">
<div class="filters" id="fs">
<button class="on" data-f="none">Normal</button>
<button data-f="saturate(1.35) contrast(1.12)">HD Vivid</button>
<button data-f="contrast(1.1) brightness(1.06) blur(.4px)">Beauty Clear</button>
<button data-f="saturate(1.3) hue-rotate(195deg)">PIZ Blue</button>
<button data-f="saturate(1.3) hue-rotate(85deg)">PIZ Green</button>
<button data-f="grayscale(1) contrast(1.1)">BW</button>
<button data-f="contrast(1.25) brightness(.96) sepia(.2)">Cinema</button>
</div>
<div class="center"><button class="btn" id="gal">🖼️</button><button id="shutter"></button><button class="btn" id="vid">●</button></div>
</div>
</div>

<script>
const v=document.getElementById('v'), c=document.getElementById('c'), fill=document.getElementById('zoomFill'), zText=document.getElementById('zoomText'), hint=document.getElementById('hint');
let stream, facing='environment', filter='none', isTorch=false, recording=false, rec;
let currentZoom=1, minZoom=1, maxZoom=5;
let startY=0, startZoom=1;

async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({
  video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:60},advanced:[{focusMode:'continuous',exposureMode:'continuous',whiteBalanceMode:'continuous'}]},
  audio:true
 });
 v.srcObject=stream;
 v.style.transform=facing==='user'?'scaleX(-1)':'none';
 setTimeout(()=>hint.remove(),3000);
}
startCam();

fs.onclick=e=>{
 if(e.target.tagName!='BUTTON')return;
 document.querySelectorAll('#fs button').forEach(b=>b.classList.remove('on'));
 e.target.classList.add('on'); filter=e.target.dataset.f; v.style.filter=filter;
};
flip.onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
torch.onclick=async()=>{
 try{const t=stream.getVideoTracks()[0];isTorch=!isTorch;await t.applyConstraints({advanced:[{torch:isTorch}]});torch.style.background=isTorch?'#2df4a0':'#0007'}catch{}
};

async function applyZoom(z){
 z=Math.max(minZoom,Math.min(maxZoom,z));
 currentZoom=z;
 // Try real optical zoom first for CLEAR quality
 try{
  await stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:z}]});
  v.style.transform=(facing==='user'?'scaleX(-1) ':'')+'scale(1)';
 }catch{
  // Fallback super-clear digital zoom with high quality rendering
  v.style.imageRendering='-webkit-optimize-contrast';
  v.style.transform=`${facing==='user'?'scaleX(-1) ':''}scale(${z})`;
 }
 const pct=((z-minZoom)/(maxZoom-minZoom))*100;
 fill.style.height=pct+'%';
 zText.textContent=z.toFixed(1)+'x';
 zText.style.display='block'; clearTimeout(zText._t);
 zText._t=setTimeout(()=>zText.style.display='none',1000);
}

// === ONE FINGER DRAG ZOOM ===
v.addEventListener('touchstart',e=>{
 if(e.touches.length!==1) return;
 startY=e.touches[0].clientY;
 startZoom=currentZoom;
},{passive:false});
