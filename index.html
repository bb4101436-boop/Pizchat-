.view{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1;overflow:auto;background:#000}

canvas{display:none}
.setRow{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111}
