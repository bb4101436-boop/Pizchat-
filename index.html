<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;width:100vw;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#watermark{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#fff;padding:6px 16px;border-radius:20px;font-weight:800;letter-spacing:2px;font-size:13px;backdrop-filter:blur(10px);border:1px solid rgba(45,244,160,0.5);z-index:20}
#zoomLabel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.6);color:#fff;padding:10px 20px;border-radius:30px;font-weight:bold;display:none;z-index:20}
#tapHint{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:12px;z-index:10;pointer-events:none}

/* Bottom Bar - Everything In Order */
#bottom{position:fixed;bottom:0;left:0;width:100%;padding:12px 0 28px;background:linear-gradient(transparent,rgba(0,0,0,0.9));z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:12px}
#filters button.active{background:#fff;color:#000;border-color:#fff;font-weight:bold}

/* Center Controls */
#controls{display:flex;align-items:center;justify-content:center;gap:40px}
.iconBtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:20px;backdrop-filter:blur(10px)}
#shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #2df4a0;box-shadow:0 0 0 6px rgba(255,255,255,0.2),0 0 30px rgba(45,244,160,0.4);transition:transform 0.08s}
#shutter:active{transform:scale(0.9)}
canvas{display:none}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<div id="watermark">PIZCAMERA</div>
<div id="zoomLabel">1.0x</div>
<div id="tapHint">Tap screen to snap • Drag up/down to zoom</div>

<div id="bottom">
  <div id="filters">
    <button class="active" onclick="setF('none',this)">Normal</button>
    <button onclick="setF('saturate(1.4) contrast(1.15)',this)">HD Clear</button>
    <button onclick="setF('saturate(1.2) hue-rotate(190deg)',this)">Piz Blue</button>
    <button onclick="setF('saturate(1.2) hue-rotate(85deg)',this)">Piz Green</button>
    <button onclick="setF('grayscale(100%)',this)">B&W</button>
    <button onclick="setF('sepia(80%)',this)">Vintage</button>
    <button onclick="setF('contrast(1.1) brightness(1.05) blur(0.5px)',this)">Beauty</button>
  </div>

  <div id="controls">
    <button class="iconBtn" id="flipBtn">↺</button>
    <button id="shutter"></button>
    <button class="iconBtn" id="flashBtn">⚡</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const zoomLabel = document.getElementById('zoomLabel');
let stream, facing='environment', zoom=1, startY=0, startZoom=1, isTorch=false;

// START - WORKING
async function start(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    video.srcObject = stream;
  }catch(e){ alert('Allow camera and use HTTPS - upload to GitHub Pages'); }
}
start();

// FILTER
function setF(f,btn){
  video.style.filter=f;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// FLIP
document.getElementById('flipBtn').onclick=()=>{ facing=facing==='user'?'environment':'user'; start(); };

// FLASH
document.getElementById('flashBtn').onclick=async()=>{
  try{
    const track=stream.getVideoTracks()[0];
    isTorch=!isTorch;
    await track.applyConstraints({advanced:[{torch:isTorch}]});
    document.getElementById('flashBtn').style.background=isTorch?'#2df4a0':'rgba(255,255,255,0.15)';
  }catch{ alert('Flash not supported on this phone'); }
};

// ZOOM - DRAG DOWN = ZOOM IN, UP = OUT - VERY CLEAR
function setZoom(z){
  zoom=Math.max(1,Math.min(4,z));
  video.style.transform = (facing==='user'?'scaleX(-1) ':'') + `scale(${zoom})`;
  zoomLabel.textContent=zoom.toFixed(1)+'x';
  zoomLabel.style.display='block';
  clearTimeout(window.t); window.t=setTimeout(()=>zoomLabel.style.display='none',700);
}

video.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ startY=e.touches[0].clientY; startZoom=zoom; }
},{passive:true});

video.addEventListener('touchmove',e=>{
  if(e.touches.length===1){
    let diff=e.touches[0].clientY-startY;
    setZoom(startZoom + diff/180);
  }
},{passive:true});

// TAKE PHOTO FUNCTION - PERFECT
function takePhoto(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  ctx.filter=video.style.filter;
  if(facing==='user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
  ctx.drawImage(video,0,0);
  
  // YOUR NAME WATERMARK - PERFECT
  ctx.filter='none';
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0, canvas.height-60, canvas.width, 60);
  ctx.fillStyle='#2df4a0';
  ctx.font=`bold ${canvas.width*0.05}px system-ui`;
  ctx.textAlign='center';
  ctx.fillText('PIZCAMERA', canvas.width/2, canvas.height-18);
  
  const a=document.createElement('a');
  a.download='PizCamera_'+Date.now()+'.jpg';
  a.href=canvas.toDataURL('image/jpeg',1.0);
  a.click();
  
  // Snap animation
  video.style.opacity='0.5';
  setTimeout(()=>video.style.opacity='1',120);
  zoomLabel.textContent='Shot! 📸 PIZCAMERA';
  zoomLabel.style.display='block';
  setTimeout(()=>zoomLabel.style.display='none',1000);
}

// CENTER TAP TO SNAP - MAIN FEATURE
video.addEventListener('click', takePhoto);
document.getElementById('shutter').onclick=takePhoto;

</script>
</body>
</html>
