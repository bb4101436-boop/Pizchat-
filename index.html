<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;height:100vh;overflow:hidden}

</div>
</div>

<div id="settingsView" class="view"><div style="padding:14px;display:flex;justify-content:space-between;background:#111"><b style="color:#fff">⚙️ Settings</b><button onclick="settingsView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button></div><div style="padding:16px 20px;color:#fff;display:flex;justify-content:space-between;border-bottom:1px solid #1a1a1a"><span>Watermark PIZCAMERA</span><select id="wmSel" style="padding:6px 12px;border-radius:10px;background:#222;color:#fff;border:none"><option value="on">ON</option><option value="off">OFF</option></select></div><div style="padding:16px 20px;color:#fff;display:flex;justify-content:space-between"><span>Timer</span><select id="timerSel" style="padding:6px 12px;border-radius:10px;background:#222;color:#fff;border:none"><option value="0">Off</option><option value="3">3s</option><option value="5">5s</option></select></div></div>

<div id="galleryView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><span style="color:#fff;font-weight:700">📸 Tap to view full</span><button onclick="galleryView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button></div><div id="grid"></div></div>

<div id="fullView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none">← Back</button><span style="color:#fff" id="fullName"></span><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#222;color:#fff;border:none">✕</button></div><img id="fullImg" style="flex:1;object-fit:contain;background:#000;display:none"><video id="fullVideo" style="flex:1;width:100%;background:#000;display:none" controls playsinline></video><div style="padding:12px;display:flex;gap:10px;justify-content:center;background:#111"><button onclick="openAIEditor()" style="padding:12px 20px;border-radius:20px;background:linear-gradient(90deg,#2df4a0,#1a73e8);border:none;font-weight:800">✨ Edit with AI</button><button onclick="downloadFull()" style="padding:12px 20px;border-radius:20px;background:#fff;border:none;font-weight:700">💾 Save</button></div></div>

<div id="aiPreview"><img id="aiImg"><div id="aiLoader"><div class="spinner"></div><span id="loaderText">AI is thinking... generating what you typed</span><span style="font-size:11px;color:#888" id="loaderPrompt"></span></div></div>

<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),shutter=document.getElementById('shutter'),recBtn=document.getElementById('recBtn'),gallery=document.getElementById('gallery'),settingsView=document.getElementById('settingsView'),galleryView=document.getElementById('galleryView'),fullView=document.getElementById('fullView'),aiView=document.getElementById('aiView'),grid=document.getElementById('grid'),timerBox=document.getElementById('timerBox'),timeText=document.getElementById('timeText'),zoomText=document.getElementById('zoomText'),fullImg=document.getElementById('fullImg'),fullVideo=document.getElementById('fullVideo'),aiImg=document.getElementById('aiImg'),promptEl=document.getElementById('prompt'),loader=document.getElementById('aiLoader'),loaderPrompt=document.getElementById('loaderPrompt');
let stream,facing='environment',zoom=1,sy=0,sz=1,rec,chunks=[],isRecording=false,watermark='on',timer=0,sec=0,timerId=null;let items=[],currentFull=null,lastSnap=null;

async function startCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:true});video.srcObject=stream;await video.play()}startCam();
function setF(f,b){video.style.filter=f;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
document.getElementById('settingsBtn').onclick=()=>settingsView.style.display='flex';
document.getElementById('flipBtn').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
document.getElementById('facingSel')?.addEventListener; // safety
document.getElementById('wmSel').onchange=e=>watermark=e.target.value;
document.getElementById('timerSel').onchange=e=>timer=parseInt(e.target.value);
document.getElementById('flashBtn').onclick=async()=>{try{let tr=stream.getVideoTracks()[0];await tr.applyConstraints({advanced:[{torch:!tr.getSettings().torch}]});}catch{}};

function addToGrid(url,type,name){items.push({url,type,name});let el=document.createElement(type==='img'?'img':'video');el.src=url;el.style.width='100%';el.style.aspectRatio='1';el.style.objectFit='cover';el.onclick=()=>openFull(url,type,name);grid.prepend(el);gallery.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;if(type==='img')lastSnap=url}
function openFull(url,type,name){currentFull={url,type,name};fullView.style.display='flex';if(type==='img'){fullImg.style.display='block';fullVideo.style.display='none';fullImg.src=url;lastSnap=url}else{fullImg.style.display='none';fullVideo.style.display='block';fullVideo.src=url}document.getElementById('fullName').textContent=name}
function downloadFull(){let a=document.createElement('a');a.href=currentFull.url;a.download=currentFull.name;a.click()}
function openAIEditor(){if(!currentFull||currentFull.type!=='img')return alert('Snap photo first');aiImg.src=currentFull.url;lastSnap=currentFull.url;fullView.style.display='none';aiView.style.display='flex'}
function downloadAI(){if(!aiImg.src)return;let a=document.createElement('a');a.href=aiImg.src;a.download='PIZ_AI_'+Date.now()+'.jpg';a.click();addToGrid(aiImg.src,'img','PIZ_AI_'+Date.now()+'.jpg')}

gallery.onclick=()=>galleryView.style.display='flex';
document.getElementById('aiBtn').onclick=()=>{if(!lastSnap)return alert('Snap photo first!');aiImg.src=lastSnap;aiView.style.display='flex'};

video.addEventListener('touchstart',e=>{if(e.touches.length===1){sy=e.touches[0].clientY;sz=zoom}if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sy=d;sz=zoom}},{passive:true});
video.addEventListener('touchmove',e=>{if(e.touches.length===1)zoom=Math.max(1,Math.min(5,sz+(e.touches[0].clientY-sy)/150));if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(1,Math.min(5,sz*(d/sy)))}video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;zoomText.textContent=zoom.toFixed(1)+'x';zoomText.style.display='block';clearTimeout(window.zt);window.zt=setTimeout(()=>zoomText.style.display='none',800)},{passive:true});

function takePhoto(){const doSnap=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;let ctx=canvas.getContext('2d');ctx.filter=video.style.filter;if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0);if(watermark==='on'){ctx.filter='none';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,canvas.height-60,canvas.width,60);ctx.fillStyle='#2df4a0';ctx.font=`bold ${canvas.width*.05}px system-ui`;ctx.textAlign='center';ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20)}canvas.toBlob(b=>{let url=URL.createObjectURL(b);let name='PIZ_'+Date.now()+'.jpg';addToGrid(url,'img',name);let a=document.createElement('a');a.href=url;a.download=name;a.click()},'image/jpeg',.92)};if(timer>0){let c=timer;let iv=setInterval(()=>{zoomText.textContent=c+'s';zoomText.style.display='block';c--;if(c<0){clearInterval(iv);zoomText.style.display='none';doSnap()}},1000)}else doSnap()}
shutter.onclick=takePhoto;
function fmt(s){let h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`}
recBtn.onclick=()=>{if(!isRecording){chunks=[];sec=0;try{rec=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:1500000})}catch{rec=new MediaRecorder(stream)}rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);let name='PIZ_'+Date.now()+'.webm';addToGrid(url,'video',name);let a=document.createElement('a');a.href=url;a.download=name;a.click()};rec.start(500);timerBox.style.display='block';timeText.textContent='● 00:00:00';timerId=setInterval(()=>{sec++;timeText.textContent='● '+fmt(sec)},1000);isRecording=true;recBtn.classList.add('on');recBtn.textContent='STOP'}else{clearInterval(timerId);timerBox.style.display='none';rec.stop();isRecording=false;recBtn.classList.remove('on');recBtn.textContent='REC'}};

function setPrompt(t){promptEl.value=t;document.querySelectorAll('.aiRow button').forEach(b=>b.classList.remove('activeAI'));if(event&&event.target)event.target.classList.add('activeAI')}

async function generateAI(){
 let p=promptEl.value.trim(); if(!p) return alert('Type what you want boss! e.g., flying in the air');
 if(!lastSnap) return alert('Snap photo first');
 let btn=document.getElementById('genBtn'); btn.disabled=true; btn.textContent='⏳ Generating...'; loader.style.display='flex'; loaderPrompt.textContent='"'+p+'"';
 try{
  // REAL AI GENERATION - uses free AI that understands any prompt
  const seed=Math.floor(Math.random()*999999);
  // We keep original photo as reference in AI Studio, and generate new image that matches prompt
  // Using Pollinations AI - works for ANY prompt the user types
  const finalPrompt=encodeURIComponent(p + ', keep same person face, photorealistic, ultra detailed, 8k, sharp focus, studio lighting');
  const aiUrl=`https://image.pollinations.ai/prompt/${finalPrompt}?seed=${seed}&width=1024&height=1024&nologo=true&enhance=true`;

  // Preload
  let testImg=new Image(); testImg.crossOrigin='anonymous';
  await new Promise((res,rej)=>{ testImg.onload=res; testImg.onerror=rej; testImg.src=aiUrl; setTimeout(res,12000); });

  // Convert to canvas to add watermark and keep
  let c2=document.createElement('canvas'); c2.width=testImg.width||1024; c2.height=testImg.height||1024;
  let ctx2=c2.getContext('2d'); ctx2.drawImage(testImg,0,0,c2.width,c2.height);
  ctx2.fillStyle='rgba(0,0,0,0.5)'; ctx2.fillRect(0,c2.height-40,c2.width,40);
  ctx2.fillStyle='#2df4a0'; ctx2.font='bold 16px system-ui'; ctx2.fillText('PIZCAMERA AI • '+p.slice(0,30),12,c2.height-14);

  let finalUrl=c2.toDataURL('image/jpeg',0.92);
  aiImg.src=finalUrl;
  addToGrid(finalUrl,'img','PIZ_AI_'+Date.now()+'.jpg');
  let a=document.createElement('a'); a.href=finalUrl; a.download='PIZ_AI_'+Date.now()+'.jpg'; a.click();

  btn.textContent='✅ Done! Saved to Gallery';
 }catch(e){
  console.log(e);
  alert('Network slow, trying again... check data');
  btn.textContent='🚀 GENERATE WHAT I TYPED';
 }
 loader.style.display='none'; btn.disabled=false;
 setTimeout(()=>btn.textContent='🚀 GENERATE WHAT
