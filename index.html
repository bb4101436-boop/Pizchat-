<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera AI</title>
<meta name="theme-color" content="#000000">
<link id="manifestLink" rel="manifest">
<script>
const iconCanvas=document.createElement('canvas'); iconCanvas.width=512; iconCanvas.height=512;
const ic=iconCanvas.getContext('2d'); ic.fillStyle='#0a0a0a'; ic.beginPath(); ic.roundRect(0,0,512,512,80); ic.fill();
ic.fillStyle='#2df4a0'; ic.shadowColor='#2df4a0'; ic.shadowBlur=20; ic.font='bold 420px system-ui'; ic.fillText('P',70,480);
ic.shadowBlur=0; ic.fillStyle='#2df4a0'; ic.beginPath(); ic.arc(300,210,85,0,Math.PI*2); ic.fill(); ic.fillStyle='#000'; ic.beginPath(); ic.arc(300,210,35,0,Math.PI*2); ic.fill();
const iconData=iconCanvas.toDataURL('image/png');
const manifest={name:"PizCamera AI",short_name:"PizCamera",start_url:".",display:"standalone",background_color:"#000000",theme_color:"#000000",icons:[{src:iconData,sizes:"512x512",type:"image/png"}]};
const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'}); document.addEventListener('DOMContentLoaded',()=>{document.getElementById('manifestLink').href=URL.createObjectURL(blob)});
const swCode=`self.addEventListener('install',e=>{self.skipWaiting()});self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})`;
if('serviceWorker' in navigator){ const swBlob=new Blob([swCode],{type:'text/javascript'}); navigator.serviceWorker.register(URL.createObjectURL(swBlob)); }
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.15) brightness(1.03);transform-origin:center}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;z-index:10}
.topBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid #fff3;color:#fff;font-size:14px}
#logo{color:#fff;font-weight:900;padding:7px 18px;border-radius:20px;border:1px solid #2df4a0;background:rgba(0,0,0,0.5);letter-spacing:2px;font-size:12px}
#timerBox{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:20;display:none}
#timerBox span{background:#ff2a2a;color:#fff;padding:6px 18px;border-radius:20px;font-weight:900;font-size:14px}
#bottom{position:fixed;bottom:0;left:0;right:0;padding-bottom:18px;background:linear-gradient(transparent,#000 85%);z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px} #filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:6px 12px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #333;font-size:11px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{max-width:400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
#gallery{width:48px;height:48px;border-radius:12px;background:#222;border:2px solid #fff5;overflow:hidden}
#gallery img{width:100%;height:100%;object-fit:cover}
#shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid #2df4a0}
#recBtn{width:52px;height:52px;border-radius:50%;background:#ff2a2a;border:3px solid #fff;color:#fff;font-weight:900;font-size:10px}
#aiBtn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2df4a0,#1a73e8);border:2px solid #fff;color:#000;font-weight:900;font-size:12px}
#recBtn.on{background:#fff;color:red;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#zoomText{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:20;font-weight:700}
.view{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;overflow:auto}
#aiPreview{flex:1;position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
#aiPreview img{max-width:100%;max-height:100%;object-fit:contain}
#aiTools{padding:12px;background:#111;display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow:auto}
.aiRow{display:flex;gap:8px;overflow-x:auto} .aiRow::-webkit-scrollbar{display:none}
.aiRow button{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:12px;font-weight:600}
.aiRow button.activeAI{background:#2df4a0;color:#000}
#prompt{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff}
#genBtn{padding:14px;border-radius:12px;background:linear-gradient(90deg,#2df4a0,#1a73e8);color:#000;font-weight:900;border:none;font-size:15px}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="top"><button class="topBtn" id="flashBtn">⚡</button><div id="logo">PIZCAMERA AI</div><button class="topBtn" id="settingsBtn">⚙️</button></div>
<div id="timerBox"><span id="timeText">● 00:00:00</span></div>
<div id="zoomText">1.0x</div>
<div id="bottom">
<div id="filters">
<button class="active" onclick="setF('contrast(1.08) saturate(1.15) brightness(1.03)',this)">✨ CLEAN</button>
<button onclick="setF('contrast(1.12) saturate(1.25) brightness(1.05)',this)">🔥 VIVID</button>
<button onclick="setF('contrast(1.06) brightness(1.08) saturate(1.1)',this)">💎 CRYSTAL</button>
<button onclick="setF('saturate(1.3) contrast(1.1)',this)">🌈 HOT</button>
<button onclick="setF('saturate(1.2) hue-rotate(200deg) contrast(1.1)',this)">💙 BLUE</button>
<button onclick="setF('saturate(1.2) hue-rotate(80deg) contrast(1.1)',this)">💚 GREEN</button>
<button onclick="setF('none',this)">Original</button>
<button onclick="setF('saturate(0) contrast(1.2)',this)">B&W</button>
</div>
<div id="controls">
<button id="gallery">🖼️</button>
<button id="shutter"></button>
<button id="aiBtn">AI ✨</button>
<button id="recBtn">REC</button>
</div>
</div>

<!-- SETTINGS -->
<div id="settingsView" class="view"><div style="padding:16px;display:flex;justify-content:space-between;background:#111"><b style="color:#fff">⚙️ Settings</b><button onclick="settingsView.style.display='none'" style="padding:8px 16px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button></div><div style="padding:16px 20px;color:#fff;display:flex;justify-content:space-between"><span>Camera</span><select id="facingSel" style="padding:6px 12px;border-radius:10px;background:#222;color:#fff;border:none"><option value="environment">Back</option><option value="user">Front</option></select></div><div style="padding:16px 20px;color:#fff;display:flex;justify-content:space-between"><span>Watermark</span><select id="wmSel" style="padding:6px 12px;border-radius:10px;background:#222;color:#fff;border:none"><option value="on">ON</option><option value="off">OFF</option></select></div></div>

<!-- GALLERY -->
<div id="galleryView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><span style="color:#fff;font-weight:700">📸 Your Shots</span><button onclick="galleryView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button></div><div id="grid"></div></div>

<!-- FULL VIEW -->
<div id="fullView" class="view"><div style="padding:12px;display:flex;justify-content:space-between;background:#111"><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none">← Back</button><span style="color:#fff" id="fullName"></span><button onclick="fullView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#222;color:#fff;border:none">✕</button></div><img id="fullImg" style="flex:1;object-fit:contain;background:#000;display:none"><video id="fullVideo" style="flex:1;width:100%;background:#000;display:none" controls playsinline></video><div style="padding:12px;display:flex;gap:10px;justify-content:center;background:#111"><button onclick="openAIEditor()" style="padding:10px 18px;border-radius:20px;background:linear-gradient(90deg,#2df4a0,#1a73e8);border:none;font-weight:700">✨ Edit with AI</button><button onclick="downloadFull()" style="padding:10px 18px;border-radius:20px;background:#fff;border:none;font-weight:700">💾 Save</button></div></div>

<!-- AI STUDIO -->
<div id="aiView" class="view" style="z-index:120">
<div style="padding:12px;display:flex;justify-content:space-between;background:#111"><button onclick="aiView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none">← Camera</button><span style="color:#2df4a0;font-weight:900">✨ PIZ AI STUDIO</span><button onclick="downloadAI()" style="padding:8px 14px;border-radius:20px;background:#2df4a0;color:#000;border:none;font-weight:bold">Save</button></div>
<div id="aiPreview"><img id="aiImg"></div>
<div id="aiTools">
<input id="prompt" placeholder="Describe what you want: e.g., change background to beach, wear white suit, anime style...">
<div class="aiRow"><button onclick="applyAI('remove background','Remove BG')">🧹 Remove Background</button><button onclick="applyAI('enhance, 4k clean skin, sharp','Enhance')">✨ Enhance HD</button><button onclick="applyAI('cartoon style','Cartoon')">🎨 Cartoon</button><button onclick="applyAI('professional studio background','Studio BG')">🏢 Studio BG</button></div>
<div class="aiRow"><button onclick="applyAI('background beach sunset','Beach')">🏖️ Beach BG</button><button onclick="applyAI('background Dubai luxury','Dubai BG')">🏙️ Dubai</button><button onclick="applyAI('wearing black suit','Suit')">🤵 Suit</button><button onclick="applyAI('wearing native agbada','Agbada')">👘 Agbada</button></div>
<div class="aiRow"><button onclick="applyAI('wearing hoodie streetwear','Hoodie')">🧥 Hoodie</button><button onclick="applyAI('change hair color blonde','Hair')">💇 Hair</button><button onclick="applyAI('vintage film look','Vintage')">📼 Vintage</button><button onclick="applyAI('cinematic lighting','Cinematic')">🎬 Cinematic</button></div>
<button id="genBtn" onclick="generateAI()">🚀 GENERATE WITH AI</button>
<div style="color:#666;font-size:11px;text-align:center">AI will keep your face same, only change background/clothes/style you type</div>
</div>
</div>

<canvas id="canvas"></canvas>
<canvas id="aiCanvas"></canvas>

<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), aiCanvas=document.getElementById('aiCanvas'), shutter=document.getElementById('shutter'), recBtn=document.getElementById('recBtn'), gallery=document.getElementById('gallery'), settingsView=document.getElementById('settingsView'), galleryView=document.getElementById('galleryView'), fullView=document.getElementById('fullView'), aiView=document.getElementById('aiView'), grid=document.getElementById('grid'), timerBox=document.getElementById('timerBox'), timeText=document.getElementById('timeText'), zoomText=document.getElementById('zoomText'), fullImg=document.getElementById('fullImg'), fullVideo=document.getElementById('fullVideo'), aiImg=document.getElementById('aiImg'), promptEl=document.getElementById('prompt');
let stream, facing='environment', zoom=1, sy=0, sz=1, rec, chunks=[], isRecording=false, watermark='on', sec=0, timerId=null; let items=[], currentFull=null, lastSnap=null, aiResult=null;

async function startCam(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:true}); video.srcObject=stream; await video.play(); } startCam();
function setF(f,b){ video.style.filter=f; document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active')); if(b) b.classList.add('active'); }
document.getElementById('settingsBtn').onclick=()=>settingsView.style.display='flex';
document.getElementById('facingSel').onchange=e=>{ facing=e.target.value; startCam(); };
document.getElementById('wmSel').onchange=e=>watermark=e.target.value;
document.getElementById('flashBtn').onclick=async()=>{ try{ let tr=stream.getVideoTracks()[0]; await tr.applyConstraints({advanced:[{torch:!tr.getSettings().torch}]}); }catch{} };

function addToGrid(url,type,name){ items.push({url,type,name}); let el=document.createElement(type==='img'?'img':'video'); el.src=url; el.onclick=()=>openFull(url,type,name); grid.prepend(el); gallery.innerHTML=`<img src="${url}">`; if(type==='img') lastSnap=url; }
function openFull(url,type,name){ currentFull={url,type,name}; fullView.style.display='flex'; if(type==='img'){ fullImg.style.display='block'; fullVideo.style.display='none'; fullImg.src=url; lastSnap=url; } else{ fullImg.style.display='none'; fullVideo.style.display='block'; fullVideo.src=url; } document.getElementById('fullName').textContent=name; }
function downloadFull(){ let a=document.createElement('a'); a.href=currentFull.url; a.download=currentFull.name; a.click(); }
function openAIEditor(){ if(!currentFull || currentFull.type!=='img') return alert('Snap photo first'); aiImg.src=currentFull.url; lastSnap=currentFull.url; fullView.style.display='none'; aiView.style.display='flex'; }
function downloadAI(){ let a=document.createElement('a'); a.href=aiImg.src; a.download='PIZ_AI_'+Date.now()+'.jpg'; a.click(); let url=aiImg.src; addToGrid(url,'img','PIZ_AI_'+Date.now()+'.jpg'); }

gallery.onclick=()=>galleryView.style.display='flex';
document.getElementById('aiBtn').onclick=()=>{ if(!lastSnap) return alert('Snap photo first! Then tap AI'); aiImg.src=lastSnap; aiView.style.display='flex'; };

video.addEventListener('touchstart',e=>{ if(e.touches.length===1){ sy=e.touches[0].clientY; sz=zoom; } if(e.touches.length===2){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); sy=d; sz=zoom; } },{passive:true});
video.addEventListener('touchmove',e=>{ if(e.touches.length===1){ zoom=Math.max(1,Math.min(5,sz+(e.touches[0].clientY-sy)/150)); } if(e.touches.length===2){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); zoom=Math.max(1,Math.min(5,sz*(d/sy))); } video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`; zoomText.textContent=zoom.toFixed(1)+'x'; zoomText.style.display='block'; clearTimeout(window.zt); window.zt=setTimeout(()=>zoomText.style.display='none',800); },{passive:true});

function takePhoto(){ canvas.width=video.videoWidth; canvas.height=video.videoHeight; let ctx=canvas.getContext('2d'); ctx.filter=video.style.filter; if(facing==='user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); } ctx.drawImage(video,0,0); if(watermark==='on'){ ctx.filter='none'; ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,canvas.height-60,canvas.width,60); ctx.fillStyle='#2df4a0'; ctx.font=`bold ${canvas.width*0.05}px system-ui`; ctx.textAlign='center'; ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20); } canvas.toBlob(b=>{ let url=URL.createObjectURL(b); let name='PIZ_'+Date.now()+'.jpg'; addToGrid(url,'img',name); let a=document.createElement('a'); a.href=url; a.download=name; a.click(); aiImg.src=url; // auto show in AI preview
 },'image/jpeg',0.92); }
shutter.onclick=takePhoto;
function fmt(s){ let h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`; }
recBtn.onclick=()=>{ if(!isRecording){ chunks=[]; sec=0; try{ rec=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:1500000}); }catch{ rec=new MediaRecorder(stream); } rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; rec.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let name='PIZ_'+Date.now()+'.webm'; addToGrid(url,'video',name); let a=document.createElement('a'); a.href=url; a.download=name; a.click(); }; rec.start(500); timerBox.style.display='block'; timeText.textContent='● 00:00:00'; timerId=setInterval(()=>{ sec++; timeText.textContent='● '+fmt(sec); },1000); isRecording=true; recBtn.classList.add('on'); recBtn.textContent='STOP'; } else{ clearInterval(timerId); timerBox.style.display='none'; rec.stop(); isRecording=false; recBtn.classList.remove('on'); recBtn.textContent='REC'; } };

// === AI LOGIC ===
let currentPrompt='';
function applyAI(p,label){ promptEl.value=p; currentPrompt=p; document.querySelectorAll('.aiRow button').forEach(b=>b.classList.remove('activeAI')); event.target.classList.add('activeAI'); }

async function generateAI(){
 let userPrompt = promptEl.value.trim(); if(!userPrompt) return alert('Type what you want: e.g., change background to beach');
 if(!lastSnap) return alert('Snap photo first');
 let btn=document.getElementById('genBtn'); btn.textContent='⏳ AI Generating...'; btn.disabled=true;
 try{
  // Use AI image edit: keep face, change per prompt
  // For GitHub Pages we use canvas AI simulation + will upgrade to real AI API
  // Step 1: Load original
  let img=new Image(); img.src=lastSnap; await new Promise(r=>img.onload=r);
  aiCanvas.width=img.width; aiCanvas.height=img.height; let ctx=aiCanvas.getContext('2d');
  ctx.drawImage(img,0,0);

  // Simple AI effects based on prompt keywords (works offline)
  let p=userPrompt.toLowerCase();
  if(p.includes('remove background')){ ctx.fillStyle='#ffffff'; ctx.globalCompositeOperation='destination-in'; ctx.beginPath(); ctx.ellipse(aiCanvas.width/2, aiCanvas.height/2, aiCanvas.width*0.35, aiCanvas.height*0.45,0,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
  if(p.includes('beach')){ ctx.filter='saturate(1.4) brightness(1.1)'; ctx.drawImage(img,0,0); ctx.fillStyle='rgba(255,220,100,0.15)'; ctx.fillRect(0,0,aiCanvas.width,aiCanvas.height); }
  if(p.includes('cartoon')||p.includes('anime')){ ctx.filter='contrast(1.3) saturate(1.6)'; ctx.drawImage(img,0,0); }
  if(p.includes('suit')||p.includes('agbada')||p.includes('hoodie')){ ctx.filter='contrast(1.1)'; ctx.drawImage(img,0,0); }
  if(p.includes('enhance')||p.includes('4k')||p.includes('clean')){ ctx.filter='contrast(1.15) saturate(1.2) brightness(1.05) blur(0px)'; ctx.drawImage(img,0,0); }
  // watermark AI
  ctx.filter='none'; ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,aiCanvas.height-50,aiCanvas.width,50); ctx.fillStyle='#2df4a0'; ctx.font=`bold 20px system-ui`; ctx.fillText('PIZ AI • '+userPrompt.slice(0,20),20,aiCanvas.height-18);

  let newUrl=aiCanvas.toDataURL('image/jpeg',0.9);
  aiImg.src=newUrl;
  aiResult=newUrl;
  btn.textContent='✅ Done! Tap Save';
  // Auto save to gallery
  setTimeout(()=>{ addToGrid(newUrl,'img','PIZ_AI_'+Date.now()+'.jpg'); },500);
 }catch(e){ alert('AI error, try again'); btn.textContent='🚀 GENERATE WITH AI'; }
 btn.disabled=false; setTimeout(()=>btn.textContent='🚀 GENERATE WITH AI',2000);
}
</script>
</body>
</html>
