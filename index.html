<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;width:100vw;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.08) saturate(1.15) brightness(1.03)}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px;z-index:10}
.topBtn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid #fff3;color:#fff}
#logo{background:rgba(0,0,0,0.5);color:#fff;padding:6px 16px;border-radius:20px;font-weight:900;letter-spacing:2px;font-size:13px;border:1px solid #2df4a0}
#bottom{position:fixed;bottom:0;left:0;right:0;padding-bottom:28px;background:linear-gradient(transparent,#000);z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:12px}
#filters button.active{background:#2df4a0;color:#000;font-weight:800}
#controls{max-width:360px;margin:0 auto;display:flex;justify-content:space-between;padding:0 30px;align-items:center}
#gallery{width:48px;height:48px;border-radius:12px;background:#222;border:2px solid #fff5;color:#fff;overflow:hidden}
#gallery img{width:100%;height:100%;object-fit:cover}
#shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid #2df4a0}
#center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:20;font-weight:bold}
canvas{display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="top">
<button class="topBtn" id="qBtn">HD</button>
<div id="logo">PIZCAMERA</div>
<button class="topBtn" id="flipBtn">↺</button>
</div>
<div id="center"></div>
<div id="bottom">
<div id="filters">
<button class="active" onclick="setFilter('contrast(1.08) saturate(1.15) brightness(1.03)',this)">✨ CLEAN HD</button>
<button onclick="setFilter('contrast(1.12) saturate(1.25) brightness(1.05)',this)">🔥 VIVID CLEAN</button>
<button onclick="setFilter('contrast(1.06) brightness(1.08) saturate(1.1)',this)">💎 CRYSTAL</button>
<button onclick="setFilter('none',this)">Original</button>
<button onclick="setFilter('saturate(0) contrast(1.2)',this)">B&W</button>
</div>
<div id="controls">
<button id="gallery">🖼️</button>
<button id="shutter"></button>
<button id="flash">⚡</button>
</div>
</div>
<canvas id="canvas"></canvas>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), shutter=document.getElementById('shutter'), center=document.getElementById('center'), gallery=document.getElementById('gallery');
let stream, facing='environment', zoom=1, sy=0, sz=1;
async function start(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160}},audio:false});
 video.srcObject=stream;
}
start();
function setFilter(f,b){
 video.style.filter=f;
 document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
}
document.getElementById('flipBtn').onclick=()=>{ facing=facing==='user'?'environment':'user'; start(); };
document.getElementById('qBtn').onclick=function(){ 
 let isHD = this.textContent==='HD';
 this.textContent=isHD?'4K':'HD';
 video.style.filter = isHD ? 'contrast(1.1) saturate(1.2) brightness(1.04) sharpness(10px)' : 'contrast(1.08) saturate(1.15) brightness(1.03)';
 center.textContent=isHD?'4K Ultra Clean':'HD Clean'; center.style.display='block'; setTimeout(()=>center.style.display='none',800);
};
// ZOOM CLEAN
video.addEventListener('touchstart',e=>{ sy=e.touches[0].clientY; sz=zoom; },{passive:true});
video.addEventListener('touchmove',e=>{
 let d=e.touches[0].clientY-sy;
 zoom=Math.max(1,Math.min(5,sz+d/150));
 video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;
},{passive:true});
// PHOTO CLEAN QUALITY
function snap(){
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 const ctx=canvas.getContext('2d');
 ctx.imageSmoothingQuality='high';
 ctx.filter=video.style.filter;
 if(facing==='user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
 ctx.drawImage(video,0,0);
 ctx.filter='none';
 ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,canvas.height-60,canvas.width,60);
 ctx.fillStyle='#2df4a0'; ctx.font=`bold ${canvas.width*0.05}px system-ui`; ctx.textAlign='center';
 ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20);
 canvas.toBlob(b=>{
  const url=URL.createObjectURL(b);
  gallery.innerHTML=`<img src="${url}">`;
  const a=document.createElement('a'); a.href=url; a.download='PIZCAMERA_'+Date.now()+'.jpg'; a.click();
  center.textContent='Clean HD Saved 📸'; center.style.display='block'; setTimeout(()=>center.style.display='none',800);
 },'image/jpeg',1.0);
}
shutter.onclick=snap;
video.onclick=snap;
</script>
</body>
</html>
