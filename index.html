<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><title>Test</title></head>
<body style="background:#080808;color:#fff;padding:20px;font-family:sans-serif;text-align:center">
<h1 style="color:#FFD600">PIZCHAT TEST LOGIN</h1>
<input id="n" placeholder="Name" style="width:90%;padding:12px;margin:5px;border-radius:10px">
<input id="ph" placeholder="Phone" style="width:90%;padding:12px;margin:5px;border-radius:10px">
<input id="e" placeholder="Email" style="width:90%;padding:12px;margin:5px;border-radius:10px">
<input id="p" placeholder="Password" type="password" style="width:90%;padding:12px;margin:5px;border-radius:10px">
<button onclick="test()" style="background:#FFD600;padding:14px;width:90%;border-radius:12px;font-weight:900;margin-top:10px">CREATE ACCOUNT TEST</button>
<p id="msg"></p>
<script>
function test(){
var n=document.getElementById('n').value,e=document.getElementById('e').value,ph=document.getElementById('ph').value,p=document.getElementById('p').value;
if(!n||!e||!ph||!p){alert('Fill all');return}
localStorage.setItem('PZ_CURRENT',JSON.stringify({name:n,email:e,phone:ph}));
document.getElementById('msg').innerHTML='SUCCESS! Saved for '+n+'<br>Now go back to main app, it will auto-login!<br><br><a href="./?v=99" style="color:#FFD600">Click here to enter main app</a>';
alert('SUCCESS! Account created for '+n);
}
var cur=localStorage.getItem('PZ_CURRENT');
if(cur){document.getElementById('msg').innerHTML='You don already login before! <a href="./?v=99" style="color:#FFD600">Enter app now</a>'}
</script></body></html>
