<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIZCAMERA</title>
<meta name="theme-color" content="#1a73e8">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;height:100dvh;width:100vw;overflow:hidden;font-family:sans-serif}
#v{width:100%;height:100%;object-fit:cover;will-change:transform;transform:translateZ(0)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.row{display:flex;justify-content:space-between;padding:14px;pointer-events:auto}
.btn{width:44px;height:44px;border-radius:50%;border:none;background:#0008;color:#fff;font-size:18px;backdrop-filter:blur(10px)}
#shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid #2df4a0;box-shadow:0 0 0 4px #fff3;transition:transform .1s}
#shutter:active{transform:scale(0.88)}
.filters{display:flex;gap:10px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;pointer-events:auto}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:9px 16px;border-radius:99px;border:1px solid #333;background:#111a;color:#fff;font-size:13px}
.filters .on{background:#1a73e8;color:#fff;border-color:#2df4a0;box-shadow:0 0 12px #1a73e8aa}
.bottom{padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent,#000d);pointer-events:auto}
.zoomWrap{padding:0 20px 8px}
#zoom{width:100%;accent-color:#2df4a0}
.center{display:flex;justify-content:space-around;align-items:center;padding:12px}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000c;padding:12px 20px;border-radius:99px;display:none;z-index:99}
canvas{display:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="msg"></div>

<div class="ui">
<div class="row">
<button class="btn" id="torch">⚡</button>
<button class="btn" id="timer">3s</button>
<button class="btn" id="flip">↺</button>
</div>
<div class="bottom">
<div class="zoomWrap"><input type="range" id="zoom" min="1" max="5" step="0.05" value="1"></div>
<div class="filters" id="fs">
<button class="on" data-f="none">Normal</button>
<button data-f="grayscale(1)">BW</button>
<button data-f="sepia(1)">Sepia</button>
<button data-f="saturate(1.4) contrast(1.15)">Vivid</button>
<button data-f="saturate(1.3) hue-rotate(190deg) contrast(1.1)">PIZ Blue</button>
<button data-f="saturate(1.3) hue-rotate(80deg) contrast(1.1)">PIZ Green</button>
<button data-f="contrast(1.1) brightness(1.05) blur(.5px)">Beauty</button>
<button data-f="contrast(1.3) brightness(.95) sepia(.3)">Cinema</button>
</div>
<div class="center">
<button class="btn" id="gal">🖼️</button>
<button id="shutter"></button>
<button class="btn" id="vid" style="background:#111a">●</button>
</div>
</div>
</div>

<script>
const v=document.getElementById('v'), c=document.getElementById('c'), msg=document.getElementById('msg');
let stream, facing='environment', filter='none', timer=0, isTorch=false, recording=false, rec;
const show=t=>{msg.textContent=t;msg.style.display='block';setTimeout(()=>msg.style.display='none',1500)};

async function start(){
 try{
  if(stream) stream.getTracks().forEach(x=>x.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60}},
    audio:true
  });
  v.srcObject=stream;
  v.style.transform=facing==='user'?'scaleX(-1)':'none';
  const track=stream.getVideoTracks()[0];
  try{await track.applyConstraints({advanced:[{focusMode:'continuous',exposureMode:'continuous',whiteBalanceMode:'continuous'}]})}catch{}
 }catch(e){show('Allow camera!');}
}
start();

fs.onclick=e=>{
 if(e.target.tagName!='BUTTON')return;
 document.querySelectorAll('#fs button').forEach(b=>b.classList.remove('on'));
 e.target.classList.add('on');
 filter=e.target.dataset.f;
 v.style.filter=filter;
};

flip.onclick=()=>{facing=facing==='user'?'environment':'user';start()};
timer.onclick=function(){timer=(timer+1)%3;this.textContent=[ 'OFF','3s','5s'][timer];show('Timer '+this.textContent)};

torch.onclick=async()=>{
 try{
  const t=stream.getVideoTracks()[0];
  isTorch=!isTorch;
  await t.applyConstraints({advanced:[{torch:isTorch}]});
  torch.style.background=isTorch?'#2df4a0':'#0008';
 }catch{show('Torch not supported')}
};

zoom.oninput=async(e)=>{
 let z=parseFloat(e.target.value);
 try{
  await stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:z}]});
 }catch{v.style.transform=`scale(${z}) ${facing==='user'?'scaleX(-1)':''}`.trim()}
};

shutter.onclick=()=>setTimeout(shoot,[0,3000,5000][timer]);

function shoot(){
 c.width=v.videoWidth; c.height=v.videoHeight;
 const ctx=c.getContext('2d');
 ctx.filter=filter;
 if(facing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)}
 ctx.drawImage(v,0,0);
 ctx.filter='none';ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`bold ${c.width*0.03}px sans-serif`;
 ctx.fillText('Shot on PIZCAMERA • PIZ AI',20,c.height-20);
 c.toBlob(b=>{
  const u=URL.createObjectURL(b); const a=document.createElement('a');
  a.href=u;a.download=`PIZ_${Date.now()}.jpg`;a.click();
  show('Saved 📸');
 },'image/jpeg',0.92);
}

vid.onclick=function(){
 if(!recording){
  let chunks=[]; rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
   const blob=new Blob(chunks,{type:'video/webm'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);
   a.download=`PIZ_${Date.now()}.webm`;a.click();show('Video saved 🎥');
  };
  rec.start(); recording=true; this.style.background='#ff2a2a'; this.textContent='■';
 }else{rec.stop();recording=false;this.style.background='#111a';this.textContent='●'}
};

gal.onclick=()=>show('Photos saved in Downloads / Gallery');
v.addEventListener('click',async(e)=>{
 try{
  const t=stream.getVideoTracks()[0];
  await t.applyConstraints({advanced:[{pointsOfInterest:[{x:e.clientX/window.innerWidth,y:e.clientY/window.innerHeight}]}]});
  show('Focus •');
 }catch{}
});
</script>
</body>
</html>
