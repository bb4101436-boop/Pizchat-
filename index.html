<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PizCamera</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;height:100vh;width:100vw;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;z-index:10}
.topBtn{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid #ffffff30;color:#fff;font-size:16px}
#logo{color:#fff;font-weight:900;letter-spacing:2px;font-size:13px;background:rgba(0,0,0,0.5);padding:6px 16px;border-radius:20px;border:1px solid #2df4a0}
#center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:20;font-weight:bold}
#bottom{position:fixed;bottom:0;left:0;right:0;padding-bottom:26px;background:linear-gradient(transparent,#000 80%);z-index:10}
#filters{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:12px}
#filters button.active{background:#fff;color:#000;font-weight:800}
#controls{width:100%;max-width:360px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
#galleryBtn{width:48px;height:48px;border-radius:12px;background:#222;border:2px solid #ffffff40;overflow:hidden;color:#fff;font-size:20px}
#galleryBtn img{width:100%;height:100%;object-fit:cover}
#shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid #2df4a0;box-shadow:0 0 0 6px #ffffff20}
#shutter.rec{background:#ff2a2a;border-color:#ff2a2a;transform:scale(1.1)}
#flashBtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid #ffffff30;color:#fff;font-size:18px}
#install{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#2df4a0;color:#000;padding:10px 20px;border-radius:30px;font-weight:800;font-size:13px;display:none;z-index:20;border:none}
#galleryView{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#galleryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;overflow:auto}
#galleryGrid img,#galleryGrid video{width:100%;aspect-ratio:1;object-fit:cover}
canvas{display:none}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>

<div id="top">
  <button class="topBtn" id="qBtn">4K</button>
  <div id="logo">PIZCAMERA</div>
  <button class="topBtn" id="flipBtn">↺</button>
</div>

<div id="center"></div>
<button id="install">📲 Install PizCamera</button>

<div id="bottom">
  <div id="filters">
    <button class="active" onclick="setF('none',this)">Normal</button>
    <button onclick="setF('saturate(1.35) contrast(1.12)',this)">HD Clear</button>
    <button onclick="setF('saturate(1.2) hue-rotate(195deg)',this)">Piz Blue</button>
    <button onclick="setF('saturate(1.2) hue-rotate(85deg)',this)">Piz Green</button>
    <button onclick="setF('grayscale(100%)',this)">B&W</button>
    <button onclick="setF('brightness(1.08) blur(0.3px)',this)">Beauty</button>
  </div>
  <div id="controls">
    <button id="galleryBtn">🖼️</button>
    <button id="shutter"></button>
    <button id="flashBtn">⚡</button>
  </div>
</div>

<canvas id="canvas"></canvas>
<input type="file" id="picker" accept="image/*,video/*" multiple hidden>

<div id="galleryView">
  <div style="padding:12px;display:flex;justify-content:space-between;background:#111">
    <button onclick="picker.click()" style="padding:8px 14px;border-radius:20px;background:#1a73e8;color:#fff;border:none;font-weight:bold">📁 Open Phone Storage</button>
    <button onclick="galleryView.style.display='none'" style="padding:8px 14px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:bold">Close ✕</button>
  </div>
  <div id="galleryGrid"></div>
</div>

<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), shutter=document.getElementById('shutter');
const galleryBtn=document.getElementById('galleryBtn'), galleryView=document.getElementById('galleryView'), galleryGrid=document.getElementById('galleryGrid');
const center=document.getElementById('center'), install=document.getElementById('install'), picker=document.getElementById('picker');
let stream, facing='environment', zoom=1, sY=0, sZ=1, torch=false, rec, chunks=[], recording=false, locked=false, timer, sSY=0, hq=true;

async function start(){
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({
  video:{facingMode:facing,width:{ideal:hq?3840:1920},height:{ideal:hq?2160:1080},frameRate:{ideal:60}},
  audio:true
 });
 video.srcObject=stream;
}
start();

function setF(f,b){ video.style.filter=f; document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
document.getElementById('flipBtn').onclick=()=>{ facing=facing==='user'?'environment':'user'; start(); };
document.getElementById('qBtn').onclick=function(){ hq=!hq; this.textContent=hq?'4K':'HD'; this.style.background=hq?'#2df4a0':'rgba(0,0,0,0.6)'; this.style.color=hq?'#000':'#fff'; start(); };
document.getElementById('flashBtn').onclick=async()=>{
 try{ const tr=stream.getVideoTracks()[0]; torch=!torch; await tr.applyConstraints({advanced:[{torch}]}); }catch{}
};

// ZOOM - DRAG UP/DOWN
video.addEventListener('touchstart',e=>{ if(e.touches.length===1){ sY=e.touches[0].clientY; sZ=zoom; } },{passive:true});
video.addEventListener('touchmove',e=>{
 if(e.touches.length===1){
  let d=e.touches[0].clientY-sY;
  zoom=Math.max(1,Math.min(5,sZ+d/150));
  video.style.transform=(facing==='user'?'scaleX(-1) ':'')+`scale(${zoom})`;
  center.textContent=zoom.toFixed(1)+'x'; center.style.display='block';
  clearTimeout(window.tt); window.tt=setTimeout(()=>center.style.display='none',600);
 }
},{passive:true});

function photo(){
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 const ctx=canvas.getContext('2d'); ctx.filter=video.style.filter;
 if(facing==='user'){ ctx.translate(canvas.width,0); ctx.scale(-1,1); }
 ctx.drawImage(video,0,0); ctx.filter='none';
 ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,canvas.height-60,canvas.width,60);
 ctx.fillStyle='#2df4a0'; ctx.font=`bold ${canvas.width*0.05}px system-ui`; ctx.textAlign='center';
 ctx.fillText('PIZCAMERA',canvas.width/2,canvas.height-20);
 canvas.toBlob(b=>{
  const url=URL.createObjectURL(b);
  addThumb(url,'img');
  const a=document.createElement('a'); a.href=url; a.download='PIZ_'+Date.now()+'.jpg'; a.click();
  center.textContent='Saved 📸'; center.style.display='block'; setTimeout(()=>center.style.display='none',800);
 },'image/jpeg',1.0);
}

function addThumb(url,type){
 const el=document.createElement(type==='img'?'img':'video');
 el.src=url; if(type!=='img') el.controls=true;
 galleryGrid.prepend(el);
 galleryBtn.innerHTML=`<img src="${url}">`;
}

function startRec(){
 chunks=[]; const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
 rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:hq?10000000:5000000});
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{
  const blob=new Blob(chunks,{type:mime}); const url=URL.createObjectURL(blob);
  addThumb(url,'video');
  const a=document.createElement('a'); a.href=url; a.download='PIZ_'+Date.now()+'.webm'; a.click();
 };
 rec.start(); recording=true; shutter.classList.add('rec'); center.textContent='● REC'; center.style.display='block';
}
function stopRec(){ if(!recording) return; rec.stop(); recording=false; locked=false; shutter.classList.remove('rec'); center.style.display='none'; }

// SHUTTER: TAP=PHOTO, HOLD=VIDEO, DRAG UP=LOCK
shutter.addEventListener('touchstart',e=>{
 e.preventDefault(); sSY=e.touches[0].clientY;
 timer=setTimeout(()=>{ startRec(); },350);
},{passive:false});
shutter.addEventListener('touchmove',e=>{
 if(!recording) return;
 if(sSY - e.touches[0].clientY > 80 && !locked){ locked=true; center.textContent='🔒 Locked - hands free'; }
},{passive:false});
shutter.addEventListener('touchend',e=>{
 e.preventDefault(); clearTimeout(timer);
 if(!recording && !locked){ photo(); }
 else if(recording && !locked){ stopRec(); }
});
shutter.addEventListener('click',()=>{ if(locked) stopRec(); });

// GALLERY - LINKS TO PHONE STORAGE
galleryBtn.onclick=()=>{ galleryView.style.display='flex'; };
picker.onchange=e=>{
 for(let f of e.target.files){
  const url=URL.createObjectURL(f);
  addThumb(url, f.type.startsWith('video')?'video':'img');
 }
};
video.addEventListener('click',()=>{ if(!recording) photo(); });

// INSTALL - EASY ON ALL DEVICES
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let promptEv;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptEv=e; install.style.display='block'; });
install.onclick=async()=>{ if(promptEv){ promptEv.prompt(); const c=await promptEv.userChoice; if(c.outcome==='accepted') install.style.display='none'; promptEv=null; } };
</script>
</body>
</html>
